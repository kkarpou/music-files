<style>
:root{--bg:#080a0d;--panel:#12161b;--panel2:#1a2027;--ink:#eef2f5;--muted:#95a0aa;--line:#35404b;--cyan:#77e2ff;--mag:#ff6db1;--amber:#ffd166;--green:#8be0b0;--red:#ff8d8d;--vio:#9b8cff;--shadow:0 24px 80px rgba(0,0,0,.5)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 18% 10%,#241521 0,#0b0f14 40%,#06080a 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}#app{height:100dvh;display:grid;grid-template-rows:44px minmax(0,1fr) 50px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,10,13,.96)}.brand{font-weight:900;letter-spacing:.16em;color:var(--cyan);font-size:.85rem}.status{font-size:.86rem;color:var(--muted)}.status strong{color:var(--ink)}main{padding:12px;overflow:hidden;display:flex;justify-content:center}.stage{width:min(1380px,100%);height:100%;overflow:hidden}.card{height:100%;border:1px solid var(--line);background:linear-gradient(145deg,rgba(24,29,36,.98),rgba(10,13,17,.99));box-shadow:var(--shadow);overflow:hidden}.controls{display:flex;justify-content:center;align-items:center;gap:20px;border-top:1px solid var(--line);background:#080b0e;color:var(--muted);font-size:.82rem}.key{border:1px solid #56616d;border-radius:4px;padding:2px 6px;color:var(--ink);font-weight:800;margin-right:4px}.center{height:100%;display:grid;place-items:center;padding:40px;text-align:center}.case-tag{letter-spacing:.22em;color:var(--mag);font-size:.78rem;font-weight:900}.title{font-size:clamp(3.2rem,7vw,6.6rem);line-height:.9;margin:.18em 0;font-weight:950}.subtitle{color:#cbd2d8;font-family:Georgia,serif;font-size:clamp(1rem,1.4vw,1.25rem);max-width:900px;line-height:1.45}.prompt{display:inline-block;margin-top:24px;border:1px solid var(--cyan);padding:10px 18px;color:var(--cyan);font-weight:900}.feed{display:grid;gap:8px;margin-top:14px;max-width:800px}.feed div{border-left:3px solid var(--mag);background:#12171d;padding:9px 12px;text-align:left}.feed strong{color:var(--cyan)}.screen{padding:20px;overflow:hidden;display:flex;flex-direction:column}.screen h2{font-size:2.2rem;margin:.1em 0}.screenhead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:12px}.screenhead p{max-width:650px;margin:0;color:var(--muted);line-height:1.35}.eyebrow{color:var(--mag);letter-spacing:.16em;text-transform:uppercase;font-weight:900;font-size:.74rem}.copy{font-family:Georgia,serif;color:#d2d7db;line-height:1.42;font-size:1.03rem}.options{display:grid;gap:8px;margin-top:auto}.option{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 12px;display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;cursor:pointer;line-height:1.22}.option small{display:block;color:var(--muted);margin-top:2px}.option.focused{outline:3px solid var(--cyan);background:#222a33;transform:translateX(2px)}.num{font-weight:900;color:var(--muted)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}.release{border:1px solid var(--line);background:#11161b;padding:14px;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px}.art{position:relative;overflow:hidden;min-height:0;background:#0c0f13}.art .name{position:absolute;left:7%;bottom:6%;font-weight:950;letter-spacing:.1em}.art.greek{background:linear-gradient(145deg,#0a0b0f,#24172a)}.art.greek:before{content:"";position:absolute;left:17%;top:15%;width:66%;height:66%;border:14px solid #ff6db1;border-radius:2px;transform:rotate(20deg)}.art.greek:after{content:"";position:absolute;left:48%;top:-10%;width:12px;height:120%;background:#77e2ff;transform:rotate(-18deg)}.art.kpop{background:linear-gradient(145deg,#120b15,#221b3c)}.art.kpop:before{content:"";position:absolute;left:17%;top:15%;width:66%;height:66%;border:12px solid #ff6db1;transform:rotate(20deg);box-shadow:0 0 0 8px rgba(155,140,255,.09)}.art.kpop:after{content:"";position:absolute;left:48%;top:-10%;width:12px;height:120%;background:#77e2ff;transform:rotate(-18deg)}.meta{color:var(--muted);font-size:.82rem;line-height:1.3}.match{color:var(--cyan);font-weight:900}.featuregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1}.feature{border:1px solid var(--line);background:#12171c;padding:14px}.feature h3{margin:.2em 0;color:var(--amber)}.feature p{color:#d5dade;line-height:1.38}.tag{display:inline-block;font-size:.68rem;letter-spacing:.12em;border:1px solid #4b5661;padding:4px 6px;color:var(--muted)}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;flex:1;align-items:center}.event{border-top:3px solid var(--cyan);background:#12171c;padding:12px;min-height:180px}.event.hot{border-top-color:var(--amber)}.event .date{color:var(--mag);font-weight:900}.event h3{margin:.35em 0}.event p{color:var(--muted);line-height:1.35}.networkwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;flex:1;min-height:0}.network{border:1px solid var(--line);background:#0b0f13;position:relative;overflow:hidden}.network svg{width:100%;height:100%}.edge{stroke:#52606d;stroke-width:2;opacity:.72}.edge.hot{stroke:var(--amber);stroke-width:4}.node circle{fill:#1d252d;stroke:#6c7a87;stroke-width:2}.node text{fill:#eef2f5;font-size:14px;font-weight:800}.node.hot circle{stroke:var(--amber);stroke-width:4}.side{border:1px solid var(--line);background:#12171c;padding:12px;overflow:auto}.side h3{margin:0 0 8px;color:var(--amber)}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #2d3740;padding:8px 0;color:#c8d0d6}.metric strong{color:var(--cyan)}.verdicts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1}.verdict{border:1px solid var(--line);background:#12171c;padding:14px}.verdict h3{margin:.2em 0;color:var(--amber)}.verdict p{color:#d5dade;line-height:1.38}.report{display:grid;grid-template-columns:270px 1fr;gap:16px;flex:1}.scorebox{border:1px solid var(--line);background:#10151a;padding:18px}.scorebig{font-size:4.8rem;font-weight:950;color:var(--cyan);line-height:.9}.scorebig small{font-size:1rem;color:var(--muted)}.bars{display:grid;gap:10px;margin-top:18px}.bar label{display:flex;justify-content:space-between;font-size:.8rem;color:#cbd2d8}.track{height:6px;background:#28313a;margin-top:4px}.fill{height:100%;background:linear-gradient(90deg,var(--mag),var(--cyan))}.conclusion{border:1px solid var(--line);background:#12171c;padding:18px;display:flex;flex-direction:column}.finding{border-left:3px solid var(--amber);padding:10px 12px;background:#1a1f24;margin:10px 0;color:#dce1e5}@media(max-height:720px){.screen{padding:14px}.screen h2{font-size:1.7rem}.copy{font-size:.9rem}.release{padding:8px}.option{padding:7px 9px;font-size:.9rem}.event{min-height:130px;padding:9px}.feature,.verdict{padding:10px}}

</head><body><div id="app"><div class="topbar"><div class="brand">THE MUSIC FILES</div><div class="status">CASE 03 · <strong>THE COPYCAT</strong></div></div><main><div id="stage" class="stage"></div></main><div class="controls"><span><b class="key">↑↓</b> επιλογή</span><span><b class="key">Enter</b> επιβεβαίωση</span><span><b class="key">H</b> hint</span><span><b class="key">Esc</b> πίσω</span></div></div>
<script>
const stage=document.getElementById('stage');const state={mode:'intro',focus:0,history:[],score:{visual:50,time:50,network:50,critical:50},verdict:null,reason:null,confidence:null};function setMode(m){state.history.push(state.mode);state.mode=m;state.focus=0;render()}function options(){return[...stage.querySelectorAll('.option')]}function updateFocus(){options().forEach((x,i)=>x.classList.toggle('focused',i===state.focus))}function bind(){options().forEach((b,i)=>b.onclick=()=>{state.focus=i;activate()});updateFocus()}
function intro(){stage.innerHTML=`<section class="card center"><div><div class="case-tag">CASE 03 · ATHENS ↔ SEOUL / 18:20</div><div class="title">THE<br>COPYCAT</div><div class="subtitle">Ένα νέο ελληνικό trap release προκαλεί αντιδράσεις: «αντέγραψαν το K-pop concept». Τα δύο artworks μοιάζουν εντυπωσιακά. Αλλά η ομοιότητα από μόνη της δεν αποδεικνύει ποιος επηρέασε ποιον — ή αν υπήρξε καθόλου αντιγραφή.</div><div class="feed"><div><strong>18:20</strong> — RELEASE POSTED</div><div><strong>18:41</strong> — “COPY?” begins trending</div><div><strong>19:05</strong> — VISUAL MATCH: 94%</div></div><div class="prompt">ENTER — ΑΝΟΙΞΕ ΤΗΝ ΥΠΟΘΕΣΗ</div></div></section>`}
function briefing(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Case briefing</div><h2>Μοιάζουν. Αλλά τι σημαίνει αυτό;</h2><div class="copy">Στόχος σου είναι να ξεχωρίσεις τέσσερις διαφορετικές εξηγήσεις: <strong>αντιγραφή</strong>, <strong>κοινός δημιουργός</strong>, <strong>κοινή οπτική τάση</strong> ή <strong>σύμπτωση</strong>. Θα χρειαστείς visual features, chronology και creative-network evidence.</div><div class="featuregrid" style="margin-top:16px"><div class="feature"><span class="tag">1</span><h3>Similarity</h3><p>Τι ακριβώς μοιάζει;</p></div><div class="feature"><span class="tag">2</span><h3>Time</h3><p>Ποιο εμφανίστηκε πρώτο;</p></div><div class="feature"><span class="tag">3</span><h3>Access</h3><p>Υπήρχε πιθανός δρόμος επιρροής;</p></div><div class="feature"><span class="tag">4</span><h3>Alternatives</h3><p>Υπάρχουν άλλες εξηγήσεις;</p></div></div><div class="options"><button class="option" data-go="compare"><span class="num">→</span><span><strong>Σύγκρινε τα δύο releases</strong></span></button></div></section>`;bind()}
function compare(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act I · Visual match</div><h2>94% similarity</h2></div><p>Το score μετρά οπτικά χαρακτηριστικά. Δεν μετρά πρόθεση, πρόσβαση ή ιστορική σχέση.</p></div><div class="compare"><div class="release"><div class="art greek"><div class="name">NOVA GHOST / STATIC</div></div><div class="meta"><span class="match">94% match</span><br>Athens · current release</div></div><div class="release"><div class="art kpop"><div class="name">AURORA-X / AFTERIMAGE</div></div><div class="meta"><span class="match">reference image</span><br>Seoul · archived concept</div></div></div><div class="options" style="grid-template-columns:repeat(4,1fr);margin-top:10px"><button class="option" data-visual="palette"><span class="num">1</span><span><strong>Palette</strong><small>pink / cyan / dark field</small></span></button><button class="option" data-visual="geometry"><span class="num">2</span><span><strong>Geometry</strong><small>rotated frame + diagonal bar</small></span></button><button class="option" data-visual="layout"><span class="num">3</span><span><strong>Layout</strong><small>central object + bottom-left title</small></span></button><button class="option" data-visual="all"><span class="num">4</span><span><strong>Συνδυασμός</strong><small>πολλά features μαζί</small></span></button></div></section>`;bind()}
function features(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Visual finding</div><h2>Το pattern είναι πραγματικό.</h2></div><p>Η ομοιότητα δεν βασίζεται σε ένα μόνο χρώμα. Επαναλαμβάνονται geometry, contrast και composition.</p></div><div class="featuregrid"><div class="feature"><span class="tag">PALETTE</span><h3>Strong</h3><p>Παρόμοιο pink/cyan contrast σε σκοτεινό field.</p></div><div class="feature"><span class="tag">GEOMETRY</span><h3>Very strong</h3><p>Περιστραμμένο τετράγωνο και λοξή φωτεινή γραμμή.</p></div><div class="feature"><span class="tag">LAYOUT</span><h3>Strong</h3><p>Κεντρικό visual element και title χαμηλά αριστερά.</p></div><div class="feature"><span class="tag">CONCLUSION</span><h3>Similarity</h3><p>Ισχυρή οπτική συγγένεια. Ακόμη όχι απόδειξη αντιγραφής.</p></div></div><div class="options"><button class="option" data-go="timeline"><span class="num">→</span><span><strong>Έλεγξε τη χρονική ακολουθία</strong></span></button></div></section>`;bind()}
function timeline(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act II · Chronology</div><h2>Ποιο μπορούσε να επηρεάσει ποιο;</h2></div><p>Η σειρά των γεγονότων περιορίζει τις πιθανές εξηγήσεις.</p></div><div class="timeline"><div class="event"><div class="date">10 ΙΑΝ</div><h3>AURORA-X concept</h3><p>Το concept δημιουργείται εσωτερικά.</p></div><div class="event hot"><div class="date">2 ΦΕΒ</div><h3>Private preview</h3><p>Παρουσιάζεται σε συνεργάτες και agencies.</p></div><div class="event"><div class="date">18 ΦΕΒ</div><h3>Trend spreads</h3><p>Παρόμοια geometry εμφανίζεται σε πολλά moodboards.</p></div><div class="event hot"><div class="date">4 ΜΑΡ</div><h3>NOVA GHOST shoot</h3><p>Το ελληνικό artwork φωτογραφίζεται/σχεδιάζεται.</p></div><div class="event"><div class="date">20 ΜΑΡ</div><h3>Public release</h3><p>Ξεσπά η συζήτηση περί αντιγραφής.</p></div></div><div class="options"><button class="option" data-time="copy"><span class="num">1</span><span><strong>Η chronology αποδεικνύει αντιγραφή</strong></span></button><button class="option" data-time="possible"><span class="num">2</span><span><strong>Η chronology κάνει την επιρροή δυνατή, όχι βέβαιη</strong></span></button><button class="option" data-time="none"><span class="num">3</span><span><strong>Η chronology δεν έχει σημασία</strong></span></button></div></section>`;bind()}
function networkSVG(){return `<svg viewBox="0 0 900 520"><line class="edge" x1="145" y1="150" x2="315" y2="105"/><line class="edge" x1="145" y1="150" x2="315" y2="220"/><line class="edge hot" x1="315" y1="220" x2="485" y2="180"/><line class="edge hot" x1="485" y1="180" x2="650" y2="130"/><line class="edge" x1="650" y1="130" x2="770" y2="90"/><line class="edge" x1="650" y1="130" x2="770" y2="210"/><g class="node"><circle cx="145" cy="150" r="44"/><text x="145" y="155" text-anchor="middle">AURORA-X</text></g><g class="node"><circle cx="315" cy="105" r="42"/><text x="315" y="110" text-anchor="middle">STUDIO K</text></g><g class="node hot"><circle cx="315" cy="220" r="46"/><text x="315" y="225" text-anchor="middle">MIRA LAB</text></g><g class="node hot"><circle cx="485" cy="180" r="48"/><text x="485" y="185" text-anchor="middle">AGENCY 04</text></g><g class="node hot"><circle cx="650" cy="130" r="48"/><text x="650" y="135" text-anchor="middle">NOVA GHOST</text></g><g class="node"><circle cx="770" cy="90" r="40"/><text x="770" y="95" text-anchor="middle">PHOTO A</text></g><g class="node"><circle cx="770" cy="210" r="40"/><text x="770" y="215" text-anchor="middle">LABEL N</text></g></svg>`}
function network(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act III · Access</div><h2>Υπήρχε διαδρομή επιρροής;</h2></div><p>Το network δεν αποδεικνύει ότι κάποιος είδε συγκεκριμένο αρχείο. Δείχνει όμως αν υπάρχει πιθανός δρόμος πρόσβασης.</p></div><div class="networkwrap"><div class="network">${networkSVG()}</div><aside class="side"><h3>Creative network</h3><div class="metric"><span>AURORA-X → MIRA LAB</span><strong>direct</strong></div><div class="metric"><span>MIRA LAB → AGENCY 04</span><strong>direct</strong></div><div class="metric"><span>AGENCY 04 → NOVA GHOST</span><strong>direct</strong></div><p class="copy" style="font-size:.9rem">Υπάρχει plausibly ένα μονοπάτι τριών βημάτων. Αυτό αυξάνει την πιθανότητα influence, αλλά δεν αποδεικνύει copying.</p></aside></div><div class="options"><button class="option" data-go="alternatives"><span class="num">→</span><span><strong>Έλεγξε τις εναλλακτικές εξηγήσεις</strong></span></button></div></section>`;bind()}
function alternatives(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act IV · Alternative explanations</div><h2>Μία ομοιότητα, τέσσερις ιστορίες.</h2></div></div><div class="verdicts"><div class="verdict"><span class="tag">A</span><h3>Direct copying</h3><p>Κάποιος είδε το concept και το αναπαρήγαγε σκόπιμα.</p></div><div class="verdict"><span class="tag">B</span><h3>Shared trend</h3><p>Και οι δύο δουλεύουν μέσα στην ίδια οπτική μόδα.</p></div><div class="verdict"><span class="tag">C</span><h3>Shared creative network</h3><p>Η αισθητική διαδίδεται μέσω κοινών συνεργατών.</p></div><div class="verdict"><span class="tag">D</span><h3>Coincidence</h3><p>Παρόμοια features εμφανίστηκαν ανεξάρτητα.</p></div></div><div class="copy" style="margin:12px 0">Με τα στοιχεία που έχουμε, ποια εξήγηση είναι καλύτερα τεκμηριωμένη;</div><div class="options" style="grid-template-columns:repeat(4,1fr)"><button class="option" data-verdict="Direct copying"><span class="num">A</span><span><strong>Direct copying</strong></span></button><button class="option" data-verdict="Shared trend"><span class="num">B</span><span><strong>Shared trend</strong></span></button><button class="option" data-verdict="Shared creative network"><span class="num">C</span><span><strong>Shared creative network</strong></span></button><button class="option" data-verdict="Coincidence"><span class="num">D</span><span><strong>Coincidence</strong></span></button></div></section>`;bind()}
function reason(){const rs=[['94% visual similarity','Ισχυρό similarity score.'],['Chronology only','Το κορεάτικο concept προηγήθηκε.'],['Creative network + chronology','Υπάρχει πιθανό access path και σωστή χρονική σειρά.'],['Online comments','Πολλοί χρήστες λένε ότι είναι αντιγραφή.']];stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 2/3</div><h2>Ποιο στοιχείο στηρίζει περισσότερο την εξήγησή σου;</h2><div class="options">${rs.map((r,i)=>`<button class="option" data-reason="${r[0]}"><span class="num">${i+1}</span><span><strong>${r[0]}</strong><small>${r[1]}</small></span></button>`).join('')}</div></section>`;bind()}
function confidence(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 3/3</div><h2>Πόσο βέβαιος είσαι;</h2><div class="copy">Η καλύτερη εξήγηση μπορεί να είναι ισχυρή χωρίς να είναι απόδειξη πρόθεσης.</div><div class="options"><button class="option" data-confidence="Low"><span class="num">1</span><span><strong>Low</strong></span></button><button class="option" data-confidence="Medium"><span class="num">2</span><span><strong>Medium</strong></span></button><button class="option" data-confidence="High"><span class="num">3</span><span><strong>High</strong></span></button></div></section>`;bind()}
function report(){const s=state.score;const total=Math.max(0,Math.min(100,Math.round((s.visual+s.time+s.network+s.critical)/4)));const best=state.verdict==='Shared creative network';const goodReason=state.reason==='Creative network + chronology';stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Case report</div><h2>${best?'Ισχυρή υπόθεση, χωρίς υπερβολικό συμπέρασμα.':'Η εξήγηση χρειάζεται περισσότερη επιφύλαξη.'}</h2></div><p>Τα δεδομένα δείχνουν ισχυρή visual similarity, σωστή chronology και πιθανό creative path. Αυτό στηρίζει διάδοση αισθητικής μέσω δικτύου περισσότερο από βέβαιη, άμεση αντιγραφή.</p></div><div class="report"><div class="scorebox"><div class="scorebig">${total}<small>/100</small></div><div class="bars">${[['Visual Analysis',s.visual],['Chronology',s.time],['Network Reasoning',s.network],['Critical Interpretation',s.critical]].map(x=>`<div class="bar"><label><span>${x[0]}</span><strong>${x[1]}</strong></label><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,x[1]))}%"></div></div></div>`).join('')}</div></div><div class="conclusion"><div class="eyebrow">Your verdict</div><h2>${state.verdict}</h2><div class="finding"><strong>Strongest evidence:</strong> ${state.reason}<br><strong>Confidence:</strong> ${state.confidence}</div><div class="copy">${best&&goodReason?'Ξεχώρισες την ομοιότητα από την αιτιώδη σχέση. Το network και η chronology στηρίζουν πιθανή διάδοση της αισθητικής, αλλά όχι ασφαλές συμπέρασμα για πρόθεση ή αντιγραφή.':'Έδωσες μεγαλύτερο βάρος σε ένα στοιχείο απ’ όσο δικαιολογεί. Στο συγκεκριμένο case, η καλύτερη ερμηνεία προκύπτει όταν συνδυάζουμε visual similarity, chronology και access path.'}</div><div class="finding"><strong>NEW FILE UNLOCKED</strong><br>CASE 04 · THE FEATURE<br><span style="color:var(--muted)">Two scenes. One artist. Why does every path pass through them?</span></div><div class="options"><button class="option" data-restart="1"><span class="num">↻</span><span><strong>Παίξε ξανά</strong></span></button></div></div></div></section>`;bind()}
function render(){({intro,briefing,compare,features,timeline,network,alternatives,reason,confidence,report}[state.mode]||intro)()}function activate(){const a=options(),el=a[state.focus];if(state.mode==='intro'){setMode('briefing');return}if(!el)return;if(el.dataset.go){setMode(el.dataset.go);return}if(el.dataset.visual){state.score.visual+=el.dataset.visual==='all'?22:12;state.score.critical+=el.dataset.visual==='all'?8:3;setMode('features');return}if(el.dataset.time){if(el.dataset.time==='possible'){state.score.time+=24;state.score.critical+=12}else{state.score.time-=8;state.score.critical-=5}setMode('network');return}if(el.dataset.verdict){state.verdict=el.dataset.verdict;if(state.verdict==='Shared creative network'){state.score.network+=22;state.score.critical+=18}else if(state.verdict==='Shared trend'){state.score.network+=8;state.score.critical+=8}else{state.score.critical-=10}setMode('reason');return}if(el.dataset.reason){state.reason=el.dataset.reason;if(state.reason==='Creative network + chronology'){state.score.network+=14;state.score.time+=10;state.score.critical+=12}else if(state.reason==='94% visual similarity'){state.score.visual+=6;state.score.critical-=6}else state.score.critical-=5;setMode('confidence');return}if(el.dataset.confidence){state.confidence=el.dataset.confidence;if(state.confidence==='Medium')state.score.critical+=8;if(state.confidence==='High'&&state.verdict==='Direct copying')state.score.critical-=8;setMode('report');return}if(el.dataset.restart)location.reload()}function move(d){const a=options();if(!a.length)return;state.focus=(state.focus+d+a.length)%a.length;updateFocus()}function back(){if(!state.history.length)return;state.mode=state.history.pop();state.focus=0;render()}function hint(){const h={compare:'Μην ψάχνεις μόνο ένα feature. Η ομοιότητα γίνεται ισχυρότερη όταν επαναλαμβάνονται πολλά χαρακτηριστικά μαζί.',timeline:'Το ότι κάτι εμφανίστηκε πρώτο είναι αναγκαίο για influence, αλλά όχι αρκετό για να αποδείξει copying.',network:'Ρώτα αν υπάρχει plausible access path ανάμεσα στα δύο creative systems.',alternatives:'Η καλύτερη εξήγηση πρέπει να ταιριάζει στα στοιχεία χωρίς να λέει περισσότερα απ’ όσα αποδεικνύουν.'};alert(h[state.mode]||'Συνδύασε visual evidence, χρόνο και σχέσεις πριν καταλήξεις.')};window.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();move(-1)}else if(['Enter',' '].includes(e.key)){e.preventDefault();activate()}else if(e.key==='Escape')back();else if(e.key.toLowerCase()==='h')hint()});render();
</script></body></html>
