<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Music Files — Case 06</title><style>
:root{--bg:#080a0d;--panel:#12161b;--panel2:#1a2027;--ink:#eef2f5;--muted:#95a0aa;--line:#35404b;--cyan:#77e2ff;--mag:#ff6db1;--amber:#ffd166;--green:#8be0b0;--red:#ff8d8d;--shadow:0 24px 80px rgba(0,0,0,.5)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 80% 8%,#1b1c33 0,#0b0f14 42%,#06080a 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}#app{height:100dvh;display:grid;grid-template-rows:44px minmax(0,1fr) 50px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,10,13,.96)}.brand{font-weight:900;letter-spacing:.16em;color:var(--cyan);font-size:.85rem}.status{font-size:.86rem;color:var(--muted)}.status strong{color:var(--ink)}main{padding:12px;overflow:hidden;display:flex;justify-content:center}.stage{width:min(1380px,100%);height:100%;overflow:hidden}.card{height:100%;border:1px solid var(--line);background:linear-gradient(145deg,rgba(24,29,36,.98),rgba(10,13,17,.99));box-shadow:var(--shadow);overflow:hidden}.controls{display:flex;justify-content:center;align-items:center;gap:20px;border-top:1px solid var(--line);background:#080b0e;color:var(--muted);font-size:.82rem}.key{border:1px solid #56616d;border-radius:4px;padding:2px 6px;color:var(--ink);font-weight:800;margin-right:4px}.center{height:100%;display:grid;place-items:center;padding:40px;text-align:center}.case-tag{letter-spacing:.22em;color:var(--mag);font-size:.78rem;font-weight:900}.title{font-size:clamp(3.1rem,7vw,6.5rem);line-height:.9;margin:.18em 0;font-weight:950}.subtitle{color:#cbd2d8;font-family:Georgia,serif;font-size:clamp(1rem,1.4vw,1.25rem);max-width:930px;line-height:1.45}.prompt{display:inline-block;margin-top:24px;border:1px solid var(--cyan);padding:10px 18px;color:var(--cyan);font-weight:900}.feed{display:grid;gap:8px;margin-top:14px;max-width:820px}.feed div{border-left:3px solid var(--mag);background:#12171d;padding:9px 12px;text-align:left}.feed strong{color:var(--cyan)}.screen{padding:20px;overflow:hidden;display:flex;flex-direction:column}.screen h2{font-size:2.2rem;margin:.1em 0}.screenhead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:12px}.screenhead p{max-width:660px;margin:0;color:var(--muted);line-height:1.35}.eyebrow{color:var(--mag);letter-spacing:.16em;text-transform:uppercase;font-weight:900;font-size:.74rem}.copy{font-family:Georgia,serif;color:#d2d7db;line-height:1.42;font-size:1.03rem}.options{display:grid;gap:8px;margin-top:auto}.option{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 12px;display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;cursor:pointer;line-height:1.22}.option small{display:block;color:var(--muted);margin-top:2px}.option.focused{outline:3px solid var(--cyan);background:#222a33;transform:translateX(2px)}.num{font-weight:900;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1}.tile{border:1px solid var(--line);background:#12171c;padding:14px}.tile h3{margin:.2em 0;color:var(--amber)}.tile p{color:#d5dade;line-height:1.36}.tag{display:inline-block;font-size:.68rem;letter-spacing:.12em;border:1px solid #4b5661;padding:4px 6px;color:var(--muted)}.model{display:grid;grid-template-columns:1fr 330px;gap:12px;flex:1;min-height:0}.panel{border:1px solid var(--line);background:#0b0f13;padding:14px;overflow:auto}.panel h3{margin:.1em 0 .6em;color:var(--amber)}.signal{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #28323b}.meter{height:8px;background:#26313a}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--mag),var(--cyan))}.pct{text-align:right;color:var(--cyan);font-weight:900}.forecast{border:1px solid var(--line);background:#12171c;padding:18px;display:flex;flex-direction:column;justify-content:center}.big{font-size:4.6rem;font-weight:950;color:var(--cyan);line-height:.9}.big small{font-size:1rem;color:var(--muted)}.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1}.compare .tile strong{display:block;font-size:2.3rem;color:var(--cyan)}.alert{border-left:4px solid var(--amber);background:#191b18;padding:12px 14px;margin-top:10px;color:#e6e2cf}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;flex:1;align-items:center}.event{border-top:3px solid var(--cyan);background:#12171c;padding:12px;min-height:180px}.event.hot{border-top-color:var(--amber)}.event .date{color:var(--mag);font-weight:900}.event h3{margin:.35em 0}.event p{color:var(--muted);line-height:1.35}.report{display:grid;grid-template-columns:270px 1fr;gap:16px;flex:1}.scorebox{border:1px solid var(--line);background:#10151a;padding:18px}.scorebig{font-size:4.8rem;font-weight:950;color:var(--cyan);line-height:.9}.scorebig small{font-size:1rem;color:var(--muted)}.bars{display:grid;gap:10px;margin-top:18px}.bar label{display:flex;justify-content:space-between;font-size:.8rem;color:#cbd2d8}.track{height:6px;background:#28313a;margin-top:4px}.fill{height:100%;background:linear-gradient(90deg,var(--mag),var(--cyan))}.conclusion{border:1px solid var(--line);background:#12171c;padding:18px;display:flex;flex-direction:column}.finding{border-left:3px solid var(--amber);padding:10px 12px;background:#1a1f24;margin:10px 0;color:#dce1e5}@media(max-height:720px){.screen{padding:14px}.screen h2{font-size:1.7rem}.copy{font-size:.9rem}.tile{padding:10px}.option{padding:7px 9px;font-size:.9rem}.event{min-height:130px;padding:9px}.big{font-size:3.7rem}}
</style></head><body><div id="app"><div class="topbar"><div class="brand">THE MUSIC FILES</div><div class="status">CASE 06 · <strong>THE ALGORITHM</strong></div></div><main><div id="stage" class="stage"></div></main><div class="controls"><span><b class="key">↑↓</b> επιλογή</span><span><b class="key">Enter</b> επιβεβαίωση</span><span><b class="key">H</b> hint</span><span><b class="key">Esc</b> πίσω</span></div></div><script>
const stage=document.getElementById('stage');const state={mode:'intro',focus:0,history:[],score:{visual:50,network:50,model:50,critical:50},answer:null,reason:null,confidence:null};function setMode(m){state.history.push(state.mode);state.mode=m;state.focus=0;render()}function options(){return[...stage.querySelectorAll('.option')]}function updateFocus(){options().forEach((x,i)=>x.classList.toggle('focused',i===state.focus))}function bind(){options().forEach((b,i)=>b.onclick=()=>{state.focus=i;activate()});updateFocus()}
function intro(){stage.innerHTML=`<section class="card center"><div><div class="case-tag">CASE 06 · PREDICTION ALERT</div><div class="title">THE<br>ALGORITHM</div><div class="subtitle">Ένας άγνωστος λογαριασμός προβλέπει το visual style επερχόμενων releases πριν δημοσιευτούν. Η ακρίβειά του φαίνεται σχεδόν υπερφυσική. Ή ίσως το μοντέλο βλέπει απλώς κάτι που οι άνθρωποι δεν κοιτούν μαζί.</div><div class="feed"><div><strong>07:40</strong> — NEXT RELEASE STYLE PREDICTED</div><div><strong>12:00</strong> — OFFICIAL TEASER PUBLISHED</div><div><strong>12:02</strong> — PREDICTION MATCH: 92%</div></div><div class="prompt">ENTER — ΑΝΟΙΞΕ ΤΗΝ ΥΠΟΘΕΣΗ</div></div></section>`}
function briefing(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Case briefing</div><h2>Είναι πραγματική πρόβλεψη ή απλώς καλό shortcut;</h2><div class="copy">Το σύστημα χρησιμοποιεί τέσσερα kinds of signals: visual history, collaboration network, timing και public trend data. Πρέπει να καταλάβεις <strong>ποιο signal προσθέτει πραγματική πληροφορία</strong> και ποιο μπορεί να λειτουργεί ως proxy ή leakage.</div><div class="grid4" style="margin-top:16px"><div class="tile"><span class="tag">VISUAL</span><h3>Style history</h3><p>Palette, layout, typography, motifs.</p></div><div class="tile"><span class="tag">NETWORK</span><h3>Creative ties</h3><p>Artists, producers, designers, studios.</p></div><div class="tile"><span class="tag">TIME</span><h3>Sequence</h3><p>Πότε συνέβη τι.</p></div><div class="tile"><span class="tag">RISK</span><h3>Leakage</h3><p>Ένα feature μπορεί να περιέχει πληροφορία από το μέλλον.</p></div></div><div class="options"><button class="option" data-go="model"><span class="num">→</span><span><strong>Άνοιξε το prediction model</strong></span></button></div></section>`;bind()}
function model(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act I · Model inputs</div><h2>Τι χρησιμοποιεί το μοντέλο;</h2></div><p>Το prediction score είναι συνδυασμός signals. Το μεγάλο βάρος δεν σημαίνει ότι το feature είναι και αιτιακά σημαντικό.</p></div><div class="model"><div class="panel"><h3>Input contribution</h3><div class="signal"><div><strong>Visual history</strong><div class="meter"><span style="width:74%"></span></div></div><div class="pct">74%</div></div><div class="signal"><div><strong>Creative network</strong><div class="meter"><span style="width:68%"></span></div></div><div class="pct">68%</div></div><div class="signal"><div><strong>Release timing</strong><div class="meter"><span style="width:42%"></span></div></div><div class="pct">42%</div></div><div class="signal"><div><strong>Public pre-save count</strong><div class="meter"><span style="width:91%"></span></div></div><div class="pct">91%</div></div></div><aside class="forecast"><div class="eyebrow">Prediction</div><div class="big">92<small>% match</small></div><p class="copy">Pastel neon · central geometry · compact title block.</p></aside></div><div class="options" style="grid-template-columns:repeat(4,1fr);margin-top:10px"><button class="option" data-input="visual"><span class="num">1</span><span><strong>Visual history</strong></span></button><button class="option" data-input="network"><span class="num">2</span><span><strong>Creative network</strong></span></button><button class="option" data-input="timing"><span class="num">3</span><span><strong>Timing</strong></span></button><button class="option" data-input="presave"><span class="num">4</span><span><strong>Pre-save count</strong></span></button></div></section>`;bind()}
function ablation(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act II · Ablation</div><h2>Αφαίρεσε ένα signal και ξανατρέξε την πρόβλεψη.</h2></div><p>Αν η απόδοση πέσει πολύ, το feature ήταν χρήσιμο. Αν πέσει υπερβολικά για ύποπτο λόγο, μπορεί να υπάρχει leakage.</p></div><div class="compare"><div class="tile"><span class="tag">FULL MODEL</span><strong>92%</strong><h3>All signals</h3><p>Visual + network + timing + pre-save.</p></div><div class="tile"><span class="tag">NO NETWORK</span><strong>76%</strong><h3>−16 pts</h3><p>Το network προσθέτει πραγματική πληροφορία.</p></div><div class="tile"><span class="tag">NO PRE-SAVE</span><strong>71%</strong><h3>−21 pts</h3><p>Μεγάλη πτώση — αλλά το pre-save ανοίγει λίγες ώρες πριν το teaser.</p></div></div><div class="alert"><strong>QUESTION:</strong> Αν το pre-save count είναι διαθέσιμο μόνο μετά την έναρξη μιας καμπάνιας, είναι νόμιμο feature για πρόβλεψη «πριν υπάρξει δημόσιο ίχνος»;</div><div class="options"><button class="option" data-ablation="leak"><span class="num">1</span><span><strong>Όχι — πιθανό data leakage</strong><small>Το feature περιέχει πληροφορία που δεν θα υπήρχε στο πραγματικό prediction time.</small></span></button><button class="option" data-ablation="good"><span class="num">2</span><span><strong>Ναι — όσο βελτιώνει accuracy είναι ΟΚ</strong></span></button><button class="option" data-ablation="irrelevant"><span class="num">3</span><span><strong>Δεν έχει σημασία πότε γίνεται διαθέσιμο</strong></span></button></div></section>`;bind()}
function timeline(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act III · Prediction time</div><h2>Η χρονική θέση ενός feature αλλάζει τα πάντα.</h2></div><p>Για να είναι έγκυρη μια πρόβλεψη, όλα τα inputs πρέπει να είναι διαθέσιμα τη στιγμή που υποτίθεται ότι γίνεται η πρόβλεψη.</p></div><div class="timeline"><div class="event"><div class="date">T−21d</div><h3>Past visuals</h3><p>Historical archive available.</p></div><div class="event"><div class="date">T−14d</div><h3>Creative network</h3><p>Collaborations already public.</p></div><div class="event"><div class="date">T−3d</div><h3>Studio booking pattern</h3><p>Partial but observable.</p></div><div class="event hot"><div class="date">T−6h</div><h3>Pre-save opens</h3><p>Campaign starts exposing demand signal.</p></div><div class="event"><div class="date">T0</div><h3>Teaser published</h3><p>Ground truth becomes visible.</p></div></div><div class="options"><button class="option" data-go="explain"><span class="num">→</span><span><strong>Δες τι απομένει χωρίς leakage</strong></span></button></div></section>`;bind()}
function explain(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act IV · Clean model</div><h2>Χωρίς το ύποπτο feature, η πρόβλεψη πέφτει — αλλά επιβιώνει.</h2></div><p>Το clean model εξακολουθεί να βρίσκει pattern, απλώς με πιο ρεαλιστική αβεβαιότητα.</p></div><div class="model"><div class="panel"><h3>Clean signals</h3><div class="signal"><div><strong>Visual history</strong><div class="meter"><span style="width:74%"></span></div></div><div class="pct">74%</div></div><div class="signal"><div><strong>Creative network</strong><div class="meter"><span style="width:68%"></span></div></div><div class="pct">68%</div></div><div class="signal"><div><strong>Timing</strong><div class="meter"><span style="width:42%"></span></div></div><div class="pct">42%</div></div></div><aside class="forecast"><div class="eyebrow">Clean prediction</div><div class="big">71<small>% confidence</small></div><p class="copy">Το μοντέλο δεν «ξέρει» το μέλλον. Εντοπίζει πιθανότητες από επαναλαμβανόμενες δομές.</p></aside></div><div class="options"><button class="option" data-explain="pattern"><span class="num">1</span><span><strong>Το μοντέλο βρίσκει probabilistic pattern</strong><small>Ισχυρό αλλά όχι βέβαιο.</small></span></button><button class="option" data-explain="cause"><span class="num">2</span><span><strong>Το μοντέλο αποδεικνύει τι θα συμβεί</strong></span></button><button class="option" data-explain="magic"><span class="num">3</span><span><strong>Το μοντέλο έχει πρόσβαση στο μέλλον</strong></span></button></div></section>`;bind()}
function final(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 1/3</div><h2>Τι εξηγεί καλύτερα την «υπερφυσική» ακρίβεια;</h2><div class="options"><button class="option" data-final="Leakage + real pattern"><span class="num">1</span><span><strong>Leakage + πραγματικό pattern</strong><small>Το σύστημα είχε και χρήσιμα signals και ένα ύποπτα ισχυρό future-adjacent feature.</small></span></button><button class="option" data-final="Perfect model"><span class="num">2</span><span><strong>Τέλειο predictive model</strong><small>92% σημαίνει ότι έχει ουσιαστικά λύσει το πρόβλημα.</small></span></button><button class="option" data-final="Random luck"><span class="num">3</span><span><strong>Τυχαία επιτυχία</strong><small>Τα networks και τα visuals δεν προσθέτουν πληροφορία.</small></span></button></div></section>`;bind()}
function reason(){const rs=[['Ablation + timing','Η απόδοση αλλάζει όταν αφαιρούμε features και ελέγχουμε πότε γίνονται διαθέσιμα.'],['Raw accuracy only','Το 92% αρκεί μόνο του.'],['Visual similarity only','Το artwork αρκεί για explanation.'],['Follower count','Popularity explains prediction.']];stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 2/3</div><h2>Ποιο είναι το ισχυρότερο evidence;</h2><div class="options">${rs.map((r,i)=>`<button class="option" data-reason="${r[0]}"><span class="num">${i+1}</span><span><strong>${r[0]}</strong><small>${r[1]}</small></span></button>`).join('')}</div></section>`;bind()}
function confidence(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 3/3</div><h2>Πόσο βέβαιος είσαι;</h2><div class="copy">Το clean model έχει χρήσιμο signal, αλλά 71% confidence δεν είναι βεβαιότητα. Η σωστή αναφορά πρέπει να κρατά αυτή την αβεβαιότητα ορατή.</div><div class="options"><button class="option" data-confidence="Low"><span class="num">1</span><span><strong>Low</strong></span></button><button class="option" data-confidence="Medium"><span class="num">2</span><span><strong>Medium</strong></span></button><button class="option" data-confidence="High"><span class="num">3</span><span><strong>High</strong></span></button></div></section>`;bind()}
function report(){const s=state.score,total=Math.max(0,Math.min(100,Math.round((s.visual+s.network+s.model+s.critical)/4)));const right=state.answer==='Leakage + real pattern',goodReason=state.reason==='Ablation + timing';stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Season report</div><h2>${right?'Το pattern υπάρχει. Η «μαγεία» όχι.':'Η εξήγηση χρειάζεται καλύτερο model audit.'}</h2></div><p>Το επεισόδιο συνδέει όλη τη σεζόν: visual similarity, network structure, chronology και uncertainty. Το κρίσιμο βήμα είναι ότι predictive performance δεν ισοδυναμεί με causal explanation.</p></div><div class="report"><div class="scorebox"><div class="scorebig">${total}<small>/100</small></div><div class="bars">${[['Visual Reasoning',s.visual],['Network Reasoning',s.network],['Model Audit',s.model],['Critical Interpretation',s.critical]].map(x=>`<div class="bar"><label><span>${x[0]}</span><strong>${x[1]}</strong></label><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,x[1]))}%"></div></div></div>`).join('')}</div></div><div class="conclusion"><div class="eyebrow">Your finding</div><h2>${state.answer}</h2><div class="finding"><strong>Strongest evidence:</strong> ${state.reason}<br><strong>Confidence:</strong> ${state.confidence}</div><div class="copy">${right&&goodReason?'Εντόπισες σωστά ότι η υψηλή επίδοση προερχόταν από δύο πράγματα μαζί: πραγματικά patterns στα visuals και στα networks, αλλά και ένα feature που ήταν χρονικά ύποπτο. Το audit του μοντέλου είναι μέρος της έρευνας, όχι τεχνική λεπτομέρεια.':'Η καλύτερη εξήγηση προκύπτει από ablation και chronology: το μοντέλο έχει πραγματικό predictive signal, αλλά το 92% ήταν φουσκωμένο από leakage.'}</div><div class="finding"><strong>SEASON THREAD</strong><br>Όλα τα cases έδειξαν το ίδιο μάθημα:<br><span style="color:var(--muted)">ένα pattern είναι στοιχείο — όχι από μόνο του εξήγηση.</span></div><div class="options"><button class="option" data-restart="1"><span class="num">↻</span><span><strong>Παίξε ξανά</strong></span></button></div></div></div></section>`;bind()}
function render(){({intro,briefing,model,ablation,timeline,explain,final,reason,confidence,report}[state.mode]||intro)()}function activate(){const a=options(),el=a[state.focus];if(state.mode==='intro'){setMode('briefing');return}if(!el)return;if(el.dataset.go){setMode(el.dataset.go);return}if(el.dataset.input){if(el.dataset.input==='presave'){state.score.model+=8;state.score.critical+=3}else if(el.dataset.input==='network'){state.score.network+=10}else if(el.dataset.input==='visual'){state.score.visual+=10}else state.score.model+=5;setMode('ablation');return}if(el.dataset.ablation){if(el.dataset.ablation==='leak'){state.score.model+=24;state.score.critical+=18}else state.score.critical-=12;setMode('timeline');return}if(el.dataset.explain){if(el.dataset.explain==='pattern'){state.score.model+=18;state.score.critical+=15;state.score.network+=6;state.score.visual+=6}else state.score.critical-=10;setMode('final');return}if(el.dataset.final){state.answer=el.dataset.final;if(state.answer==='Leakage + real pattern'){state.score.model+=20;state.score.critical+=14}else state.score.critical-=10;setMode('reason');return}if(el.dataset.reason){state.reason=el.dataset.reason;if(state.reason==='Ablation + timing'){state.score.model+=18;state.score.critical+=10}else state.score.critical-=6;setMode('confidence');return}if(el.dataset.confidence){state.confidence=el.dataset.confidence;if(state.confidence==='Medium')state.score.critical+=8;if(state.confidence==='High'&&state.answer!=='Perfect model')state.score.critical+=3;setMode('report');return}if(el.dataset.restart)location.reload()}function move(d){const a=options();if(!a.length)return;state.focus=(state.focus+d+a.length)%a.length;updateFocus()}function back(){if(!state.history.length)return;state.mode=state.history.pop();state.focus=0;render()}function hint(){const h={model:'Ένα feature με μεγάλο contribution μπορεί να είναι χρήσιμο — ή να κρύβει πληροφορία που δεν θα έπρεπε να είναι διαθέσιμη.',ablation:'Ablation σημαίνει αφαιρώ ένα input και βλέπω πόσο αλλάζει η απόδοση.',timeline:'Prediction time σημαίνει: τι ήταν πραγματικά γνωστό τη στιγμή της πρόβλεψης;',explain:'Prediction ≠ certainty και prediction ≠ causal explanation.'};alert(h[state.mode]||'Έλεγξε όχι μόνο πόσο καλά προβλέπει το μοντέλο, αλλά και με ποια πληροφορία το πετυχαίνει.')};window.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();move(-1)}else if(['Enter',' '].includes(e.key)){e.preventDefault();activate()}else if(e.key==='Escape')back();else if(e.key.toLowerCase()==='h')hint()});render();
</script></body></html>
