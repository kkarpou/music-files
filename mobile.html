<!doctype html>
<html lang="el">
<head>

<meta name="theme-color" content="#080a0d">
<title>The Music Files — Mobile</title>
<style>

</head>
<body>
<div id="shell"><iframe id="game" src="./" title="The Music Files" allow="autoplay; fullscreen"></iframe><nav class="touchbar" aria-label="Χειρισμός παιχνιδιού"><button class="touch" data-key="Escape"><span class="icon">←</span><span class="label">Πίσω</span></button><button class="touch" data-key="ArrowUp"><span class="icon">↑</span><span class="label">Πάνω</span></button><button class="touch primary" data-key="Enter"><span class="icon">●</span><span class="label">Επιλογή</span></button><button class="touch" data-key="ArrowDown"><span class="icon">↓</span><span class="label">Κάτω</span></button><button class="touch" data-key="h"><span class="icon">?</span><span class="label">Hint</span></button></nav></div>
<script>
const frame=document.getElementById('game');
const css=String.raw`
*{min-width:0!important;box-sizing:border-box!important}

body{height:100%!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-y:contain!important;touch-action:pan-y!important}

main{display:block!important;width:100%!important;height:auto!important;overflow:visible!important;padding:6px!important}.stage{width:100%!important;height:auto!important;min-height:calc(100dvh - 48px)!important;overflow:visible!important}.card{width:100%!important;height:auto!important;min-height:calc(100dvh - 48px)!important;overflow:visible!important}.controls{display:none!important}
.center{min-height:calc(100dvh - 48px)!important;padding:22px 14px!important}.case-tag{font-size:.68rem!important;letter-spacing:.15em!important}.title{font-size:clamp(2.9rem,16vw,4.7rem)!important;line-height:.88!important}.subtitle{font-size:1rem!important;line-height:1.42!important}.feed{gap:6px!important}.feed div{padding:8px 10px!important;font-size:.84rem!important}.prompt{font-size:.84rem!important;padding:10px 13px!important;margin-top:18px!important}

.covers{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;height:auto!important;min-height:0!important;overflow:visible!important;flex:none!important}.covercard{padding:6px!important;gap:4px!important}.fakecover{width:100%!important;aspect-ratio:1!important}.fakecover .name{font-size:.62rem!important;line-height:1.05!important}.covermeta,.match{font-size:.68rem!important;line-height:1.15!important}.match{margin-top:1px!important}

.statement-grid{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;height:auto!important;min-height:0!important;overflow:visible!important;flex:none!important}.statement{padding:10px!important}.statement h3{font-size:1rem!important;margin:.25em 0!important}.statement p{font-size:.9rem!important;line-height:1.32!important;margin:.4em 0 0!important}.tag{font-size:.62rem!important}
.networkwrap{display:block!important;height:auto!important;min-height:0!important;overflow:visible!important}.network{width:100%!important;height:auto!important;min-height:0!important;aspect-ratio:1.15!important;overflow:hidden!important;margin-bottom:8px!important}.network svg{width:100%!important;height:100%!important;display:block!important}.node text{font-size:16px!important}.legend{height:auto!important;max-height:none!important;overflow:visible!important;padding:10px!important}.legend h3{font-size:1rem!important}.legend .copy{font-size:.88rem!important}.metric{padding:6px 0!important;font-size:.82rem!important}

.report{display:block!important;height:auto!important;min-height:0!important;overflow:visible!important}.scorebox{padding:12px!important;margin-bottom:10px!important}.scorebig{font-size:3.7rem!important}.bars{gap:8px!important;margin-top:12px!important}.bar label{font-size:.76rem!important}.conclusion{padding:12px!important;overflow:visible!important}.conclusion h2{font-size:1.9rem!important}.finding{padding:9px 10px!important;font-size:.88rem!important;line-height:1.32!important;margin:8px 0!important}

@media(min-width:500px) and (orientation:portrait){.covers{grid-template-columns:repeat(3,1fr)!important}.screen>.options[style*="repeat(5"]{grid-template-columns:repeat(2,1fr)!important}.network{aspect-ratio:1.35!important}.statement-grid{grid-template-columns:1fr 1fr!important}.statement-grid .statement:last-child{grid-column:1 / -1!important}.timeline{grid-template-columns:1fr 1fr!important}.report{display:grid!important;grid-template-columns:210px 1fr!important;gap:10px!important}.scorebox{margin-bottom:0!important}}
@media(orientation:landscape) and (max-height:600px){.topbar{height:36px!important;min-height:36px!important}.brand{font-size:.6rem!important}.status{font-size:.6rem!important}main{padding:4px!important}.stage,.card{min-height:calc(100dvh - 42px)!important}.center{min-height:calc(100dvh - 42px)!important;padding:16px!important}.title{font-size:clamp(2.6rem,8vw,4.2rem)!important}.casefile{display:grid!important;grid-template-columns:30% 70%!important;align-items:start!important}.sidebar{position:sticky!important;top:36px!important;display:block!important;border-right:1px solid var(--line)!important;border-bottom:0!important;padding:10px!important;min-height:calc(100dvh - 42px)!important}.sidebar>.cover-main{width:min(100%,190px)!important;max-width:190px!important;margin:8px auto!important}.sidebar>.eyebrow,.sidebar>h2,.sidebar>.copy,.sidebar>.chip,.sidebar>.evidence-list{display:block!important}.sidebar>h2{font-size:1.45rem!important}.sidebar>.copy{font-size:.82rem!important}.screen{padding:9px!important}.screen h2{font-size:1.5rem!important}.screenhead{display:grid!important;grid-template-columns:1fr .8fr!important;gap:10px!important;align-items:end!important}.covers{grid-template-columns:repeat(4,1fr)!important;gap:6px!important}.covercard{padding:4px!important}.screen>.options[style*="repeat(5"]{grid-template-columns:repeat(5,1fr)!important;gap:5px!important}.screen>.options[style*="repeat(5"] .option:last-child{grid-column:auto!important}.option{min-height:42px!important;padding:7px!important;font-size:.82rem!important}.screen>.options[style*="repeat(3"]{grid-template-columns:1fr 1fr 1fr!important;gap:6px!important}.screen>.options[style*="repeat(3"] .option{grid-template-columns:26px minmax(0,1fr)!important;min-height:52px!important;padding:7px 8px!important}.screen>.options[style*="repeat(3"] .option .num{width:24px!important;height:24px!important;font-size:.7rem!important}.screen>.options[style*="repeat(3"] .option strong{font-size:.76rem!important;line-height:1.15!important}.networkwrap{display:grid!important;grid-template-columns:minmax(0,1fr) 210px!important;gap:7px!important}.network{height:calc(100dvh - 185px)!important;min-height:260px!important;aspect-ratio:auto!important;margin:0!important}.legend{padding:8px!important}.metric{padding:4px 0!important;font-size:.74rem!important}.statement-grid{grid-template-columns:repeat(3,1fr)!important;gap:7px!important}.statement{padding:8px!important}.timeline{grid-template-columns:repeat(4,1fr)!important;gap:7px!important}.event{padding:8px!important}.event p{font-size:.78rem!important}.report{display:grid!important;grid-template-columns:190px 1fr!important;gap:8px!important}.scorebox{margin:0!important;padding:10px!important}.scorebig{font-size:3.1rem!important}.conclusion{padding:10px!important}.conclusion h2{font-size:1.55rem!important}}
`;
function sendKey(key){try{frame.contentWindow.focus();frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}))}catch(e){}}
document.querySelectorAll('.touch').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();sendKey(b.dataset.key)}));
frame.addEventListener('load',()=>{try{const d=frame.contentDocument;const s=d.createElement('style');s.id='music-mobile-overrides';s.textContent=css;d.head.appendChild(s);const st=d.getElementById('stage');if(st)new MutationObserver(()=>{d.body.scrollTop=0;d.documentElement.scrollTop=0}).observe(st,{childList:true})}catch(e){console.error(e)}});
</script>
</body>
</html>
