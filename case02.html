<title>The Music Files — Case 02</title>
<style>
:root{--bg:#080a0d;--panel:#12161b;--panel2:#1a2027;--ink:#eef2f5;--muted:#95a0aa;--line:#35404b;--cyan:#77e2ff;--mag:#ff6db1;--vio:#9b8cff;--amber:#ffd166;--green:#8be0b0;--shadow:0 24px 80px rgba(0,0,0,.5)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 82% 10%,#21162b 0,#0d1015 38%,#06080a 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}#app{height:100dvh;display:grid;grid-template-rows:44px minmax(0,1fr) 50px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,10,13,.96)}.brand{font-weight:900;letter-spacing:.16em;color:var(--cyan);font-size:.85rem}.status{font-size:.86rem;color:var(--muted)}.status strong{color:var(--ink)}main{padding:12px;overflow:hidden;display:flex;justify-content:center}.stage{width:min(1380px,100%);height:100%;overflow:hidden}.card{height:100%;border:1px solid var(--line);background:linear-gradient(145deg,rgba(24,29,36,.98),rgba(10,13,17,.99));box-shadow:var(--shadow);overflow:hidden}.controls{display:flex;justify-content:center;align-items:center;gap:20px;border-top:1px solid var(--line);background:#080b0e;color:var(--muted);font-size:.82rem}.key{border:1px solid #56616d;border-radius:4px;padding:2px 6px;color:var(--ink);font-weight:800;margin-right:4px}.center{height:100%;display:grid;place-items:center;padding:40px;text-align:center}.case-tag{letter-spacing:.22em;color:var(--mag);font-size:.78rem;font-weight:900}.title{font-size:clamp(3.2rem,7vw,6.6rem);line-height:.9;margin:.18em 0;font-weight:950}.subtitle{color:#cbd2d8;font-family:Georgia,serif;font-size:clamp(1rem,1.4vw,1.25rem);max-width:860px;line-height:1.45}.prompt{display:inline-block;margin-top:24px;border:1px solid var(--cyan);padding:10px 18px;color:var(--cyan);font-weight:900}.feed{display:grid;gap:8px;margin-top:14px;max-width:760px}.feed div{border-left:3px solid var(--mag);background:#12171d;padding:9px 12px;text-align:left}.feed strong{color:var(--cyan)}.screen{padding:20px;overflow:hidden;display:flex;flex-direction:column}.screen h2{font-size:2.2rem;margin:.1em 0}.screenhead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:12px}.screenhead p{max-width:650px;margin:0;color:var(--muted);line-height:1.35}.eyebrow{color:var(--mag);letter-spacing:.16em;text-transform:uppercase;font-weight:900;font-size:.74rem}.copy{font-family:Georgia,serif;color:#d2d7db;line-height:1.42;font-size:1.03rem}.options{display:grid;gap:8px;margin-top:auto}.option{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 12px;display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;cursor:pointer;line-height:1.22}.option small{display:block;color:var(--muted);margin-top:2px}.option.focused{outline:3px solid var(--cyan);background:#222a33;transform:translateX(2px)}.num{font-weight:900;color:var(--muted)}.concepts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1;min-height:0}.concept{border:1px solid var(--line);background:#11161b;padding:8px;display:flex;flex-direction:column;gap:6px}.art{aspect-ratio:1;position:relative;overflow:hidden;background:#101218}.art .label{position:absolute;left:7%;bottom:6%;font-size:.72rem;font-weight:950;letter-spacing:.08em}.art.a{background:linear-gradient(145deg,#f5d4ff,#98ddff)}.art.a:before{content:"";position:absolute;width:58%;height:58%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,#ff6db1 9% 38%,#6b5cff 39% 62%,transparent 63%);left:21%;top:17%;filter:blur(.2px)}.art.b{background:linear-gradient(160deg,#080b13,#2a1641)}.art.b:before{content:"";position:absolute;inset:14%;border:2px solid #9b8cff;box-shadow:0 0 0 10px rgba(155,140,255,.08);transform:rotate(10deg)}.art.c{background:#f2f1ed;color:#101216}.art.c:before{content:"";position:absolute;width:76%;height:24%;background:#111;left:12%;top:35%;transform:rotate(-8deg)}.art.d{background:linear-gradient(145deg,#ffe6ef,#f9b7d5)}.art.d:before{content:"";position:absolute;width:70%;height:70%;border-radius:50%;left:15%;top:15%;background:radial-gradient(circle,#fff 0 9%,#ff6db1 10% 28%,#88dfff 29% 52%,#9b8cff 53% 70%,transparent 71%)}.art.e{background:linear-gradient(135deg,#121924,#384b63)}.art.e:before{content:"";position:absolute;inset:18%;background:repeating-linear-gradient(90deg,#77e2ff 0 3px,transparent 3px 13px)}.art.f{background:linear-gradient(145deg,#f5d4ff,#98ddff)}.art.f:before{content:"";position:absolute;width:58%;height:58%;border-radius:50%;background:conic-gradient(#ff6db1,#77e2ff,#9b8cff,#ff6db1);left:21%;top:18%;box-shadow:0 0 0 8px rgba(255,255,255,.18)}.meta{font-size:.75rem;color:var(--muted);line-height:1.2}.match{font-size:.8rem;color:var(--cyan);font-weight:900}.featuregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1}.feature{border:1px solid var(--line);background:#12171c;padding:16px}.feature h3{margin:.2em 0;color:var(--amber)}.feature p{color:#d5dade;line-height:1.38}.tag{display:inline-block;font-size:.7rem;letter-spacing:.12em;border:1px solid #4b5661;padding:4px 6px;color:var(--muted)}.cluster{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;flex:1;min-height:0}.plot{border:1px solid var(--line);background:radial-gradient(circle at 40% 45%,rgba(119,226,255,.05),transparent 40%),#0b0f13;position:relative;overflow:hidden}.axisx,.axisy{position:absolute;background:#39444e}.axisx{height:1px;left:8%;right:5%;bottom:10%}.axisy{width:1px;top:6%;bottom:10%;left:8%}.dot{position:absolute;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.58rem;font-weight:900;color:#071014;background:var(--cyan);box-shadow:0 0 0 4px rgba(119,226,255,.08)}.dot.pink{background:var(--mag)}.dot.vio{background:var(--vio);color:#fff}.dot.target{width:28px;height:28px;border:3px solid #fff}.side{border:1px solid var(--line);background:#12171c;padding:12px;overflow:auto}.side h3{margin:0 0 8px;color:var(--amber)}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #2d3740;padding:8px 0;color:#c8d0d6}.metric strong{color:var(--cyan)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}.comparebox{border:1px solid var(--line);background:#11161b;padding:14px}.comparebox h3{margin:.3em 0}.smallart{width:min(250px,80%);aspect-ratio:1;margin:10px auto}.network{border:1px solid var(--line);background:#0b0f13;flex:1;position:relative;overflow:hidden}.network svg{width:100%;height:100%}.edge{stroke:#53616e;stroke-width:2}.edge.hot{stroke:var(--amber);stroke-width:4}.node circle{fill:#221d2e;stroke:#7a6e8d;stroke-width:2}.node text{fill:#eef2f5;font-size:14px;font-weight:800}.report{display:grid;grid-template-columns:270px 1fr;gap:16px;flex:1}.scorebox{border:1px solid var(--line);background:#10151a;padding:18px}.scorebig{font-size:4.8rem;font-weight:950;color:var(--cyan);line-height:.9}.scorebig small{font-size:1rem;color:var(--muted)}.bars{display:grid;gap:10px;margin-top:18px}.bar label{display:flex;justify-content:space-between;font-size:.8rem;color:#cbd2d8}.track{height:6px;background:#28313a;margin-top:4px}.fill{height:100%;background:linear-gradient(90deg,var(--mag),var(--cyan))}.conclusion{border:1px solid var(--line);background:#12171c;padding:18px;display:flex;flex-direction:column}.finding{border-left:3px solid var(--amber);padding:10px 12px;background:#1a1f24;margin:10px 0;color:#dce1e5}@media(max-height:720px){.screen{padding:14px}.screen h2{font-size:1.7rem}.copy{font-size:.9rem}.concept{padding:6px}.option{padding:7px 9px;font-size:.9rem}.feature{padding:10px}}
</style>
</head><body><div id="app"><div class="topbar"><div class="brand">THE MUSIC FILES</div><div class="status">CASE 02 · <strong>THE LOST COMEBACK</strong></div></div><main><div id="stage" class="stage"></div></main><div class="controls"><span><b class="key">↑↓</b> επιλογή</span><span><b class="key">Enter</b> επιβεβαίωση</span><span><b class="key">H</b> hint</span><span><b class="key">Esc</b> πίσω</span></div></div>
<script>
const stage=document.getElementById('stage');const state={mode:'intro',focus:0,history:[],score:{visual:50,pattern:50,evidence:50,critical:50},team:null,reason:null,confidence:null};const teams=['NEON7','AURORA-X','VELVET//5','PROJECT N'];function setMode(m){state.history.push(state.mode);state.mode=m;state.focus=0;render()}function options(){return[...stage.querySelectorAll('.option')]}function updateFocus(){options().forEach((x,i)=>x.classList.toggle('focused',i===state.focus))}function bind(){options().forEach((b,i)=>b.onclick=()=>{state.focus=i;activate()});updateFocus()}function art(cls,label){return `<div class="art ${cls}"><div class="label">${label}</div></div>`}
function intro(){stage.innerHTML=`<section class="card center"><div><div class="case-tag">CASE 02 · SEOUL / 04:40</div><div class="title">THE LOST<br>COMEBACK</div><div class="subtitle">Έξι concept images βρέθηκαν σε έναν παλιό creative server. Δεν υπάρχει group name, release date ή final cover. Μόνο ένα visual system που φαίνεται γνώριμο.</div><div class="feed"><div><strong>04:40</strong> — ARCHIVE PACK RECOVERED</div><div><strong>04:43</strong> — METADATA: PARTIAL</div><div><strong>04:46</strong> — VISUAL MATCHES DETECTED</div></div><div class="prompt">ENTER — ΑΝΟΙΞΕ ΤΟ CASE</div></div></section>`}
function briefing(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Case briefing</div><h2>Ένα comeback που ίσως δεν κυκλοφόρησε ποτέ.</h2><div class="copy">Στόχος σου δεν είναι να «μαντέψεις το group» από την αισθητική. Πρέπει να διαχωρίσεις <strong>οπτική ομοιότητα</strong>, <strong>σταθερά χαρακτηριστικά</strong> και <strong>σχέσεις δημιουργικής παραγωγής</strong>.</div><div class="featuregrid" style="margin-top:16px"><div class="feature"><span class="tag">LOOK</span><h3>Palette</h3><p>Χρώματα, contrast, saturation.</p></div><div class="feature"><span class="tag">COMPARE</span><h3>Composition</h3><p>Σχήματα, layout, typography.</p></div><div class="feature"><span class="tag">CONNECT</span><h3>Creative network</h3><p>Studios, art directors, visual teams.</p></div></div><div class="options"><button class="option" data-go="gallery"><span class="num">→</span><span><strong>Άνοιξε τα concept images</strong></span></button></div></section>`;bind()}
function gallery(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act I · Visual scan</div><h2>Ποια εικόνα ανήκει πιθανότερα στο ίδιο visual system;</h2></div><p>Μην κοιτάς μόνο το χρώμα. Ψάξε επαναλαμβανόμενη οργάνωση της εικόνας.</p></div><div class="concepts"><div class="concept">${art('a','ARCHIVE 01')}<div class="meta">pastel gradient · central orb</div><div class="match">target</div></div><div class="concept">${art('d','ARCHIVE 02')}<div class="meta">pink field · layered orb</div></div><div class="concept">${art('f','ARCHIVE 03')}<div class="meta">pastel gradient · central orb</div></div><div class="concept">${art('b','ARCHIVE 04')}<div class="meta">dark field · framed square</div></div><div class="concept">${art('c','ARCHIVE 05')}<div class="meta">monochrome · diagonal type</div></div><div class="concept">${art('e','ARCHIVE 06')}<div class="meta">cool field · line rhythm</div></div><div class="concept">${art('a','NEON7 / HALO')}<div class="meta">released · 2025</div></div><div class="concept">${art('d','AURORA-X / BLOOM')}<div class="meta">released · 2026</div></div></div><div class="options" style="grid-template-columns:repeat(4,1fr);margin-top:10px">${teams.map((t,i)=>`<button class="option" data-team="${t}"><span class="num">${i+1}</span><span><strong>${t}</strong></span></button>`).join('')}</div></section>`;bind()}
function features(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act II · Feature check</div><h2>Ποιο χαρακτηριστικό είναι πιο διαγνωστικό;</h2></div><p>Ένα κοινό χρώμα είναι εύκολο να αντιγραφεί. Ένα επαναλαμβανόμενο visual grammar είναι πιο ισχυρό.</p></div><div class="featuregrid"><div class="feature"><span class="tag">A</span><h3>Ροζ / μπλε παλέτα</h3><p>Εμφανίζεται σε πολλά διαφορετικά projects.</p></div><div class="feature"><span class="tag">B</span><h3>Κεντρικός πολυεπίπεδος κύκλος</h3><p>Επαναλαμβάνεται μαζί με συγκεκριμένο spacing και hierarchy.</p></div><div class="feature"><span class="tag">C</span><h3>Pastel saturation</h3><p>Κοινό stylistic trend της περιόδου.</p></div></div><div class="options" style="grid-template-columns:repeat(3,1fr)"><button class="option" data-feature="weak"><span class="num">1</span><span><strong>Παλέτα</strong></span></button><button class="option" data-feature="strong"><span class="num">2</span><span><strong>Visual grammar</strong></span></button><button class="option" data-feature="weak"><span class="num">3</span><span><strong>Saturation</strong></span></button></div></section>`;bind()}
function cluster(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act III · Cluster map</div><h2>Το σύστημα ομαδοποιεί. Εσύ ερμηνεύεις.</h2></div><p>Οι άξονες είναι απλοποιημένα visual features: geometry και colour structure.</p></div><div class="cluster"><div class="plot"><div class="axisx"></div><div class="axisy"></div><div class="dot pink" style="left:20%;top:60%">A</div><div class="dot pink" style="left:28%;top:54%">B</div><div class="dot pink" style="left:34%;top:63%">C</div><div class="dot vio" style="left:69%;top:22%">D</div><div class="dot vio" style="left:74%;top:31%">E</div><div class="dot" style="left:52%;top:48%">F</div><div class="dot target" style="left:31%;top:49%">?</div></div><aside class="side"><h3>Cluster readout</h3><div class="metric"><span>Cluster A</span><strong>orb / pastel</strong></div><div class="metric"><span>Cluster B</span><strong>dark / frame</strong></div><div class="metric"><span>Outlier</span><strong>line rhythm</strong></div><p class="copy" style="font-size:.9rem">Το άγνωστο pack πέφτει κοντά στο Cluster A. Αυτό δείχνει ομοιότητα — όχι ακόμη δημιουργική προέλευση.</p></aside></div><div class="options"><button class="option" data-go="falselead"><span class="num">→</span><span><strong>Έλεγξε το false lead</strong></span></button></div></section>`;bind()}
function falselead(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Act IV · False lead</div><h2>Το πιο όμοιο release δεν είναι πάντα το σωστό.</h2><div class="compare"><div class="comparebox"><span class="tag">91% VISUAL MATCH</span><h3>NEON7 / HALO</h3><div class="smallart">${art('a','HALO')}</div><p class="copy">Σχεδόν ίδια palette και central orb.</p></div><div class="comparebox"><span class="tag">METADATA</span><h3>Different creative team</h3><div class="smallart">${art('f','ARCHIVE')}</div><p class="copy">Το HALO πιστώνεται στο Studio Lumen. Το archive pack έχει fragment: <strong>CT-04</strong>.</p></div></div><div class="options"><button class="option" data-go="network"><span class="num">→</span><span><strong>Ακολούθησε το CT-04</strong></span></button></div></section>`;bind()}
function network(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act V · Creative network</div><h2>Το visual clue αποκτά σχέση.</h2></div><p>Το CT-04 δεν είναι group. Είναι creative team code.</p></div><div class="network"><svg viewBox="0 0 900 480"><line class="edge" x1="190" y1="130" x2="380" y2="180"/><line class="edge hot" x1="380" y1="180" x2="570" y2="115"/><line class="edge hot" x1="380" y1="180" x2="570" y2="270"/><line class="edge" x1="570" y1="115" x2="750" y2="95"/><line class="edge" x1="570" y1="270" x2="750" y2="315"/><g class="node"><circle cx="190" cy="130" r="44"/><text x="190" y="135" text-anchor="middle">LUMEN</text></g><g class="node"><circle cx="380" cy="180" r="48"/><text x="380" y="185" text-anchor="middle">CT-04</text></g><g class="node"><circle cx="570" cy="115" r="48"/><text x="570" y="120" text-anchor="middle">AURORA-X</text></g><g class="node"><circle cx="570" cy="270" r="48"/><text x="570" y="275" text-anchor="middle">PROJECT N</text></g><g class="node"><circle cx="750" cy="95" r="45"/><text x="750" y="100" text-anchor="middle">BLOOM</text></g><g class="node"><circle cx="750" cy="315" r="45"/><text x="750" y="320" text-anchor="middle">UNREL.</text></g></svg></div><div class="options"><button class="option" data-go="deduction"><span class="num">→</span><span><strong>Κλείσε το case</strong><small>Συνδύασε visual grammar και creative network.</small></span></button></div></section>`;bind()}
function deduction(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 1/3</div><h2>Σε ποιο project ανήκει πιθανότερα το lost comeback;</h2><div class="options">${teams.map((t,i)=>`<button class="option" data-final="${t}"><span class="num">${i+1}</span><span><strong>${t}</strong><small>${t==='AURORA-X'?'linked to CT-04 and Cluster A':'partial or misleading match'}</small></span></button>`).join('')}</div></section>`;bind()}
function reason(){const rs=[['Highest colour similarity','Το πιο κοντινό palette match.'],['Shared visual grammar','Επαναλαμβανόμενη σύνθεση και hierarchy.'],['Creative-team link','Το CT-04 συνδέεται με το project.'],['Popularity','Το group είναι πιο γνωστό.']];stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 2/3</div><h2>Ποιο είναι το ισχυρότερο τεκμήριο;</h2><div class="options">${rs.map((r,i)=>`<button class="option" data-reason="${r[0]}"><span class="num">${i+1}</span><span><strong>${r[0]}</strong><small>${r[1]}</small></span></button>`).join('')}</div></section>`;bind()}
function confidence(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 3/3</div><h2>Πόσο βέβαιος είσαι;</h2><div class="copy">Το visual match και το network συγκλίνουν, αλλά το archive παραμένει ελλιπές.</div><div class="options"><button class="option" data-confidence="Low"><span class="num">1</span><span><strong>Low</strong></span></button><button class="option" data-confidence="Medium"><span class="num">2</span><span><strong>Medium</strong></span></button><button class="option" data-confidence="High"><span class="num">3</span><span><strong>High</strong></span></button></div></section>`;bind()}
function report(){const s=state.score,total=Math.round((s.visual+s.pattern+s.evidence+s.critical)/4),right=state.team==='AURORA-X',strong=['Creative-team link','Shared visual grammar'].includes(state.reason);stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Case report</div><h2>${right?'Το pattern κρατά.':'Η υπόθεση μένει ανοιχτή.'}</h2></div><p>Το ισχυρότερο συμπέρασμα προκύπτει όταν visual grammar και creative-team metadata συγκλίνουν.</p></div><div class="report"><div class="scorebox"><div class="scorebig">${total}<small>/100</small></div><div class="bars">${[['Visual Analysis',s.visual],['Pattern Reading',s.pattern],['Evidence',s.evidence],['Critical Interpretation',s.critical]].map(x=>`<div class="bar"><label><span>${x[0]}</span><strong>${x[1]}</strong></label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div></div>`).join('')}</div></div><div class="conclusion"><div class="eyebrow">Your deduction</div><h2>${state.team}</h2><div class="finding"><strong>Strongest evidence:</strong> ${state.reason}<br><strong>Confidence:</strong> ${state.confidence}</div><div class="copy">${right&&strong?'Δεν στηρίχθηκες μόνο στο «μοιάζει». Συνδύασες σταθερά visual features με ανεξάρτητο metadata link.':'Έδωσες υπερβολικό βάρος σε ένα μόνο είδος similarity. Το case απαιτεί συνδυασμό μορφής και σχέσης.'}</div><div class="finding"><strong>SEASON THREAD UPDATED</strong><br>Το CT-04 εμφανίζεται και σε project εκτός K-pop.<br><span style="color:var(--muted)">Next case: THE COPYCAT</span></div><div class="options"><button class="option" data-restart="1"><span class="num">↻</span><span><strong>Παίξε ξανά</strong></span></button></div></div></div></section>`;bind()}
function render(){({intro,briefing,gallery,features,cluster,falselead,network,deduction,reason,confidence,report}[state.mode]||intro)()}function activate(){const a=options(),el=a[state.focus];if(state.mode==='intro'){setMode('briefing');return}if(!el)return;if(el.dataset.go){setMode(el.dataset.go);return}if(el.dataset.team){state.team=el.dataset.team;state.score.visual+=el.dataset.team==='AURORA-X'?12:5;setMode('features');return}if(el.dataset.feature){if(el.dataset.feature==='strong'){state.score.pattern+=20;state.score.critical+=12}else{state.score.pattern-=5}setMode('cluster');return}if(el.dataset.final){state.team=el.dataset.final;if(state.team==='AURORA-X'){state.score.visual+=16;state.score.evidence+=12}else state.score.critical-=7;setMode('reason');return}if(el.dataset.reason){state.reason=el.dataset.reason;if(['Creative-team link','Shared visual grammar'].includes(state.reason)){state.score.evidence+=18;state.score.critical+=10}else state.score.evidence-=5;setMode('confidence');return}if(el.dataset.confidence){state.confidence=el.dataset.confidence;if(el.dataset.confidence==='Medium')state.score.critical+=10;if(el.dataset.confidence==='High'&&state.team==='AURORA-X')state.score.critical+=5;setMode('report');return}if(el.dataset.restart)location.reload()}function move(d){const a=options();if(!a.length)return;state.focus=(state.focus+d+a.length)%a.length;updateFocus()}function back(){if(!state.history.length)return;state.mode=state.history.pop();state.focus=0;render()}function hint(){const h={gallery:'Κοίτα ποιο visual στοιχείο επαναλαμβάνεται μαζί με το layout, όχι μόνο ποια χρώματα μοιάζουν.',features:'Η παλέτα μπορεί να είναι trend. Το visual grammar συνδυάζει περισσότερες από μία επιλογές σύνθεσης.',cluster:'Το cluster δείχνει ομοιότητα. Χρειάζεσαι και ανεξάρτητο metadata.',deduction:'Το CT-04 είναι το κλειδί που συνδέει το visual pattern με συγκεκριμένο project.'};alert(h[state.mode]||'Συνδύασε τουλάχιστον δύο ανεξάρτητα είδη στοιχείων.')}window.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();move(-1)}else if(['Enter',' '].includes(e.key)){e.preventDefault();activate()}else if(e.key==='Escape')back();else if(e.key.toLowerCase()==='h')hint()});render();
</script></body></html>
