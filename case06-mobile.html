<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a0d"><title>The Music Files — Case 06 Mobile</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#shell{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 68px}#game{width:100%;height:100%;border:0;background:#080a0d}.touchbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:#333c45;padding:1px 1px calc(1px + env(safe-area-inset-bottom));border-top:1px solid #56616d}.touch{border:0;background:#10151a;color:#eef2f5;min-width:0;min-height:54px;padding:5px 2px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;touch-action:manipulation}.touch.primary{background:#17303a;color:#77e2ff}.icon{font-size:1.28rem;font-weight:900;line-height:1}.label{font-size:.64rem;line-height:1;white-space:nowrap}@media(orientation:landscape) and (max-height:600px){#shell{grid-template-rows:minmax(0,1fr) 52px}.touch{min-height:44px;flex-direction:row;gap:4px}.icon{font-size:1rem}.label{font-size:.6rem}}</style></head><body><div id="shell"><iframe id="game" src="./case06.html" title="The Music Files Case 06"></iframe><nav class="touchbar"><button class="touch" data-key="Escape"><span class="icon">←</span><span class="label">Πίσω</span></button><button class="touch" data-key="ArrowUp"><span class="icon">↑</span><span class="label">Πάνω</span></button><button class="touch primary" data-key="Enter"><span class="icon">●</span><span class="label">Επιλογή</span></button><button class="touch" data-key="ArrowDown"><span class="icon">↓</span><span class="label">Κάτω</span></button><button class="touch" data-key="h"><span class="icon">?</span><span class="label">Hint</span></button></nav></div><script>
