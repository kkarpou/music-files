<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a0d"><title>The Music Files — Case 03 Mobile</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#shell{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 68px}.touchbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:#333c45;padding:1px 1px calc(1px + env(safe-area-inset-bottom));border-top:1px solid #56616d}.touch{border:0;background:#10151a;color:#eef2f5;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.touch.primary{background:#17303a;color:#77e2ff}.icon{font-size:1.25rem;font-weight:900;line-height:1}.label{font-size:.63rem;line-height:1;white-space:nowrap}iframe{width:100%;height:100%;border:0;background:#080a0d}@media(orientation:landscape) and (max-height:600px){#shell{grid-template-rows:minmax(0,1fr) 52px}.touch{min-height:44px;flex-direction:row;gap:4px}.icon{font-size:1rem}.label{font-size:.6rem}}</style></head><body><div id="shell"><iframe id="game" src="case03.html"></iframe><nav class="touchbar"><button class="touch" data-key="Escape"><span class="icon">←</span><span class="label">Πίσω</span></button><button class="touch" data-key="ArrowUp"><span class="icon">↑</span><span class="label">Πάνω</span></button><button class="touch primary" data-key="Enter"><span class="icon">●</span><span class="label">Επιλογή</span></button><button class="touch" data-key="ArrowDown"><span class="icon">↓</span><span class="label">Κάτω</span></button><button class="touch" data-key="h"><span class="icon">?</span><span class="label">Hint</span></button></nav></div><script>const f=document.getElementById('game');const css=String.raw`*{min-width:0!important;box-sizing:border-box!important}html{height:100%!important;overflow:hidden!important}body{height:100%!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-y!important}#app{height:auto!important;min-height:100%!important;display:block!important}.topbar{position:sticky!important;top:0!important;z-index:30!important;height:40px!important;min-height:40px!important;padding:0 10px!important}.brand{font-size:.66rem!important}.status{font-size:.66rem!important;max-width:55vw!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}main{display:block!important;height:auto!important;overflow:visible!important;padding:6px!important}.stage,.card{height:auto!important;min-height:calc(100dvh - 48px)!important;overflow:visible!important}.controls{display:none!important}.center{min-height:calc(100dvh - 48px)!important;padding:22px 14px!important}.title{font-size:clamp(2.9rem,16vw,4.8rem)!important}.subtitle{font-size:1rem!important}.feed div{font-size:.84rem!important;padding:8px 10px!important}.prompt{font-size:.84rem!important}.screen{height:auto!important;overflow:visible!important;padding:12px!important}.screen h2{font-size:1.72rem!important;line-height:1.05!important}.screenhead{display:block!important}.screenhead p{font-size:.87rem!important;margin-top:5px!important}.copy{font-size:.96rem!important}.compare{grid-template-columns:1fr!important;height:auto!important;overflow:visible!important}.release{padding:8px!important;grid-template-rows:auto auto!important}.art{aspect-ratio:1!important;min-height:0!important}.featuregrid,.verdicts{grid-template-columns:1fr!important;height:auto!important;overflow:visible!important;gap:8px!important}.feature,.verdict{padding:10px!important}.options{grid-template-columns:1fr!important;height:auto!important;overflow:visible!important;gap:7px!important;margin-top:10px!important}.option{min-height:50px!important;width:100%!important;transform:none!important;padding:9px 10px!important;font-size:.92rem!important}.screen>.options[style*="repeat(4"]{grid-template-columns:1fr 1fr!important}.timeline{grid-template-columns:1fr!important;height:auto!important;overflow:visible!important;gap:8px!important}.event{min-height:0!important;padding:10px!important}.networkwrap{display:block!important;height:auto!important;overflow:visible!important}.network{height:auto!important;aspect-ratio:1.15!important;margin-bottom:8px!important}.side{overflow:visible!important}.report{grid-template-columns:1fr!important;height:auto!important;overflow:visible!important}.scorebox{margin-bottom:10px!important}.scorebig{font-size:3.7rem!important}.conclusion{overflow:visible!important;padding:12px!important}.finding{font-size:.88rem!important}@media(max-width:360px){.screen{padding:10px!important}.screen h2{font-size:1.52rem!important}.screen>.options[style*="repeat(4"]{grid-template-columns:1fr!important}.option{font-size:.87rem!important}.network{aspect-ratio:1!important}}@media(min-width:500px) and (orientation:portrait){.featuregrid,.verdicts{grid-template-columns:1fr 1fr!important}.timeline{grid-template-columns:1fr 1fr!important}.compare{grid-template-columns:1fr 1fr!important}.report{grid-template-columns:210px 1fr!important;gap:10px!important}}@media(orientation:landscape) and (max-height:600px){.topbar{height:36px!important;min-height:36px!important}main{padding:4px!important}.stage,.card{min-height:calc(100dvh - 42px)!important}.screen{padding:9px!important}.screen h2{font-size:1.5rem!important}.screenhead{display:grid!important;grid-template-columns:1fr .8fr!important;gap:10px!important}.compare{grid-template-columns:1fr 1fr!important}.featuregrid,.verdicts{grid-template-columns:repeat(4,1fr)!important;gap:7px!important}.timeline{grid-template-columns:repeat(5,1fr)!important;gap:6px!important}.event{padding:8px!important}.event p{font-size:.76rem!important}.networkwrap{display:grid!important;grid-template-columns:minmax(0,1fr) 210px!important;gap:7px!important}.network{height:calc(100dvh - 185px)!important;min-height:260px!important;aspect-ratio:auto!important;margin:0!important}.screen>.options[style*="repeat(4"]{grid-template-columns:repeat(4,1fr)!important}.option{min-height:42px!important;font-size:.8rem!important;padding:7px!important}.report{grid-template-columns:190px 1fr!important;gap:8px!important}}`;function send(k){try{f.contentWindow.focus();f.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true}))}catch(e){}}document.querySelectorAll('.touch').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();send(b.dataset.key)}));f.addEventListener('load',()=>{try{const d=f.contentDocument,s=d.createElement('style');s.textContent=css;d.head.appendChild(s);const st=d.getElementById('stage');if(st)new MutationObserver(()=>{d.body.scrollTop=0;d.documentElement.scrollTop=0}).observe(st,{childList:true})}catch(e){console.error(e)}});</script></body></html>
