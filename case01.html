<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Music Files — Case 01</title>
<style>
:root{--bg:#080a0d;--panel:#12161b;--panel2:#1a2027;--ink:#eef2f5;--muted:#95a0aa;--line:#35404b;--cyan:#77e2ff;--mag:#ff6db1;--amber:#ffd166;--green:#8be0b0;--red:#ff8d8d;--shadow:0 24px 80px rgba(0,0,0,.5)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 15% 8%,#18202a 0,#0b0f14 38%,#06080a 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}
#app{height:100dvh;display:grid;grid-template-rows:44px minmax(0,1fr) 50px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,10,13,.96)}.brand{font-weight:900;letter-spacing:.16em;color:var(--cyan);font-size:.85rem}.status{font-size:.86rem;color:var(--muted)}.status strong{color:var(--ink)}
main{padding:12px;overflow:hidden;display:flex;justify-content:center}.stage{width:min(1380px,100%);height:100%;overflow:hidden}.card{height:100%;border:1px solid var(--line);background:linear-gradient(145deg,rgba(24,29,36,.98),rgba(10,13,17,.99));box-shadow:var(--shadow);overflow:hidden}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;border-top:1px solid var(--line);background:#080b0e;color:var(--muted);font-size:.82rem}.key{border:1px solid #56616d;border-radius:4px;padding:2px 6px;color:var(--ink);font-weight:800;margin-right:4px}
.center{height:100%;display:grid;place-items:center;padding:40px;text-align:center}.case-tag{letter-spacing:.22em;color:var(--mag);font-size:.78rem;font-weight:900}.title{font-size:clamp(3.3rem,7vw,6.8rem);line-height:.9;margin:.18em 0;font-weight:950}.subtitle{color:#cbd2d8;font-family:Georgia,serif;font-size:clamp(1rem,1.4vw,1.25rem);max-width:850px;line-height:1.45}.prompt{display:inline-block;margin-top:24px;border:1px solid var(--cyan);padding:10px 18px;color:var(--cyan);font-weight:900}
.casefile{height:100%;display:grid;grid-template-columns:36% 64%}.sidebar{border-right:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:14px;background:#0e1318}.sidebar h2{font-size:2.2rem;line-height:1;margin:0}.eyebrow{color:var(--mag);letter-spacing:.16em;text-transform:uppercase;font-weight:900;font-size:.74rem}.copy{font-family:Georgia,serif;color:#d2d7db;line-height:1.42;font-size:1.03rem}.screen{padding:20px;overflow:hidden;display:flex;flex-direction:column}.screen h2{font-size:2.2rem;margin:.1em 0}.screenhead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:12px}.screenhead p{max-width:650px;margin:0;color:var(--muted);line-height:1.35}
.feed{display:grid;gap:8px;margin-top:14px}.feed div{border-left:3px solid var(--cyan);background:#12171d;padding:9px 12px;text-align:left}.feed strong{color:var(--cyan)}
.cover-main{aspect-ratio:1;background:#090b0f;border:1px solid #46515d;position:relative;overflow:hidden;display:grid;place-items:center}.cover-main:before{content:"";position:absolute;width:68%;height:68%;border:14px solid var(--mag);transform:rotate(32deg);box-shadow:0 0 45px rgba(255,109,177,.18)}.cover-main:after{content:"NO SIGNAL";position:absolute;left:8%;bottom:7%;font-size:clamp(1.4rem,3vw,3rem);letter-spacing:.18em;font-weight:950}.cover-main .slash{position:absolute;width:12px;height:120%;background:var(--cyan);transform:rotate(-24deg);opacity:.72}
.evidence-list{display:grid;gap:7px;margin-top:8px}.chip{border:1px solid #3c4651;background:#161b21;padding:8px 10px;color:#cbd2d8;font-size:.9rem}.chip strong{color:var(--amber)}
.options{display:grid;gap:8px;margin-top:auto}.option{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 12px;display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;cursor:pointer;line-height:1.22}.option small{display:block;color:var(--muted);margin-top:2px}.option.focused{outline:3px solid var(--cyan);background:#222a33;transform:translateX(2px)}.option.good{border-color:var(--green)}.num{font-weight:900;color:var(--muted)}
.covers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-height:0;flex:1}.covercard{border:1px solid var(--line);background:#11161b;padding:9px;display:flex;flex-direction:column;gap:6px}.fakecover{aspect-ratio:1;position:relative;overflow:hidden;background:#111}.fakecover .name{position:absolute;left:7%;bottom:6%;font-size:.75rem;font-weight:950;letter-spacing:.08em}.fakecover.vanta{background:linear-gradient(145deg,#0b0c10 0 58%,#ff4c9b 58%)}.fakecover.vanta:before{content:"";position:absolute;width:62%;height:62%;border:9px solid #7ee7ff;left:18%;top:17%;transform:rotate(29deg)}.fakecover.nero{background:linear-gradient(135deg,#07090b,#1b2634)}.fakecover.nero:before{content:"";position:absolute;inset:18%;background:radial-gradient(circle,#ffd166 0 12%,transparent 13%),repeating-linear-gradient(90deg,transparent 0 14px,#ffd166 15px 16px)}.fakecover.soma{background:#ece7df;color:#101214}.fakecover.soma:before{content:"";position:absolute;width:80%;height:20%;background:#ff6d6d;left:10%;top:28%;transform:rotate(-12deg)}.fakecover.void{background:#090b0f}.fakecover.void:before{content:"";position:absolute;width:68%;height:68%;border:12px solid #ff6db1;left:16%;top:16%;transform:rotate(32deg)}.fakecover.void:after{content:"";position:absolute;width:10px;height:120%;background:#77e2ff;left:54%;top:-10%;transform:rotate(-24deg)}.fakecover.mira{background:linear-gradient(180deg,#181018,#090b10)}.fakecover.mira:before{content:"";position:absolute;width:80%;height:80%;border:2px solid #ffd166;border-radius:50%;left:10%;top:10%;box-shadow:0 0 0 12px rgba(255,209,102,.07)}.fakecover.onyx{background:linear-gradient(45deg,#122032,#61203c)}.fakecover.onyx:before{content:"";position:absolute;inset:20%;background:linear-gradient(135deg,#78e3ff,#ff6db1);clip-path:polygon(50% 0,100% 100%,0 100%)}.fakecover.echo{background:#101111}.fakecover.echo:before{content:"";position:absolute;left:10%;right:10%;top:18%;bottom:18%;background:repeating-linear-gradient(0deg,#eef 0 2px,transparent 2px 14px)}.covermeta{font-size:.78rem;color:var(--muted)}.match{font-size:.82rem;color:var(--cyan);font-weight:900}
.networkwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;min-height:0;flex:1}.network{border:1px solid var(--line);background:#0b0f13;position:relative;overflow:hidden}.network svg{width:100%;height:100%}.edge{stroke:#52606d;stroke-width:2;opacity:.62}.edge.bridge{stroke:var(--amber);stroke-width:4;opacity:.95}.node{cursor:pointer}.node circle{fill:#1d252d;stroke:#6c7a87;stroke-width:2}.node text{fill:#e7edf1;font-size:13px;font-weight:800}.node.artist circle{fill:#1d2e34}.node.producer circle{fill:#301d2a}.node.mira circle{stroke:var(--amber);stroke-width:4}.legend{border:1px solid var(--line);background:#12171c;padding:12px;overflow:auto}.legend h3{margin:0 0 8px;color:var(--amber)}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #2d3740;padding:8px 0;color:#c8d0d6}.metric strong{color:var(--cyan)}
.statement-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1}.statement{border:1px solid var(--line);background:#12171c;padding:14px}.statement h3{margin:.2em 0;color:var(--amber)}.statement p{color:#d5dade;line-height:1.4}.tag{display:inline-block;font-size:.7rem;letter-spacing:.12em;border:1px solid #4b5661;padding:4px 6px;color:var(--muted)}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1;align-items:center}.event{border-top:3px solid var(--cyan);background:#12171c;padding:12px;min-height:180px}.event .date{color:var(--mag);font-weight:900}.event h3{margin:.35em 0}.event p{color:var(--muted);line-height:1.35}
.report{display:grid;grid-template-columns:270px 1fr;gap:16px;flex:1}.scorebox{border:1px solid var(--line);background:#10151a;padding:18px}.scorebig{font-size:4.8rem;font-weight:950;color:var(--cyan);line-height:.9}.scorebig small{font-size:1rem;color:var(--muted)}.bars{display:grid;gap:10px;margin-top:18px}.bar label{display:flex;justify-content:space-between;font-size:.8rem;color:#cbd2d8}.track{height:6px;background:#28313a;margin-top:4px}.fill{height:100%;background:linear-gradient(90deg,var(--mag),var(--cyan))}.conclusion{border:1px solid var(--line);background:#12171c;padding:18px;display:flex;flex-direction:column}.conclusion h2{font-size:2.4rem;margin:.15em 0}.finding{border-left:3px solid var(--amber);padding:10px 12px;background:#1a1f24;margin:10px 0;color:#dce1e5}
@media(max-height:720px){.screen,.sidebar{padding:14px}.screen h2,.sidebar h2{font-size:1.7rem}.copy{font-size:.9rem}.covercard{padding:6px}.covermeta{font-size:.68rem}.option{padding:7px 9px;font-size:.9rem}.event{min-height:130px;padding:9px}.statement{padding:10px}}
</style>
</head>
<body>
<div id="app"><div class="topbar"><div class="brand">THE MUSIC FILES</div><div class="status" id="status">CASE 01 · <strong>THE MISSING PRODUCER</strong></div></div><main><div id="stage" class="stage"></div></main><div class="controls"><span><b class="key">↑↓</b> επιλογή</span><span><b class="key">Enter</b> επιβεβαίωση</span><span><b class="key">H</b> hint</span><span><b class="key">Esc</b> πίσω</span></div></div>
<script>
const stage=document.getElementById('stage');
const state={mode:'intro',focus:0,history:[],score:{visual:55,network:50,evidence:50,critical:50},suspect:null,reason:null,confidence:null};
const suspects=['VOID87','NERO','SOMA','KID VANTA','MIRA'];
function setMode(m){state.history.push(state.mode);state.mode=m;state.focus=0;render()}
function options(){return [...stage.querySelectorAll('.option')]}
function updateFocus(){options().forEach((x,i)=>x.classList.toggle('focused',i===state.focus))}
function bind(){options().forEach((b,i)=>b.onclick=()=>{state.focus=i;activate()});updateFocus()}
function cover(cls,name,meta,match=''){return `<div class="covercard"><div class="fakecover ${cls}"><div class="name">${name}</div></div><div class="covermeta">${meta}</div>${match?`<div class="match">${match}</div>`:''}</div>`}
function intro(){stage.innerHTML=`<section class="card center"><div><div class="case-tag">CASE 01 · ATHENS / 02:13</div><div class="title">THE<br>MUSIC FILES</div><div class="subtitle">Ένα ανώνυμο trap track εμφανίζεται online. Δεν έχει artist, label ή producer credit. Το artwork δείχνει προς μία κατεύθυνση. Το δίκτυο συνεργασιών προς άλλη.</div><div class="feed"><div><strong>02:13</strong> — NEW UPLOAD DETECTED</div><div><strong>02:47</strong> — 8,930 plays</div><div><strong>03:22</strong> — TRENDING / ATHENS</div></div><div class="prompt">ENTER — ΑΝΟΙΞΕ ΤΗΝ ΥΠΟΘΕΣΗ</div></div></section>`}
function briefing(){stage.innerHTML=`<section class="card casefile"><aside class="sidebar"><div class="eyebrow">Case briefing</div><h2>NO SIGNAL</h2><div class="cover-main"><div class="slash"></div></div></aside><div class="screen"><div class="screenhead"><div><div class="eyebrow">Η ανάθεση</div><h2>Κάποιος άφησε ίχνη.</h2></div></div><div class="copy">Δεν θέλω να μου πεις απλώς <strong>με τι σου μοιάζει</strong>. Θέλω να μου πεις <strong>γιατί</strong>. Θα εξετάσεις το εξώφυλλο, τις συνεργασίες και το χρονολόγιο. Στο τέλος θα υποστηρίξεις μία υπόθεση.</div><div class="evidence-list"><div class="chip"><strong>VISUAL LAB</strong> · χρώμα, σύνθεση, typography, style</div><div class="chip"><strong>NETWORK BOARD</strong> · artists, producers, crews, connections</div><div class="chip"><strong>CASE LOGIC</strong> · παρατήρηση ≠ τεκμήριο ≠ συμπέρασμα</div></div><div class="options"><button class="option" data-go="visual"><span class="num">→</span><span><strong>Άνοιξε το Visual Lab</strong><small>Πρώτα κοίτα. Μετά υπόθεσε.</small></span></button></div></div></section>`;bind()}
function visual(){stage.innerHTML=`<section class="card casefile"><aside class="sidebar"><div class="eyebrow">Act I · Look</div><h2>Visual Lab</h2><div class="cover-main"><div class="slash"></div></div><div class="copy">Ποιο release φαίνεται πιο κοντά οπτικά στο NO SIGNAL;</div></aside><div class="screen"><div class="screenhead"><div><div class="eyebrow">Visual candidates</div><h2>Μην εμπιστεύεσαι την πρώτη εντύπωση.</h2></div><p>Τα ποσοστά βασίζονται μόνο σε οπτικά χαρακτηριστικά του prototype: palette, geometry, contrast και composition.</p></div><div class="covers">${cover('void','VOID87 / GLASS','2025 · independent','91% similarity')}${cover('vanta','KID VANTA / RUSH','2026 · NOVA','84% similarity')}${cover('nero','NERO / LATE RUN','2025 · HUSH','72% similarity')}${cover('soma','SOMA / WHITE ROOM','2026 · AXIS','46% similarity')}${cover('mira','MIRA / ORBIT','2025 · independent','43% similarity')}${cover('onyx','ONYX / STATIC','2026 · NOVA','39% similarity')}${cover('echo','ECHO / LINE','2024 · HUSH','31% similarity')}${cover('nero','NERO / 02AM','2026 · HUSH','29% similarity')}</div><div class="options" style="grid-template-columns:repeat(5,1fr);margin-top:10px">${suspects.map((s,i)=>`<button class="option" data-visual="${s}"><span class="num">${i+1}</span><span><strong>${s}</strong></span></button>`).join('')}</div></div></section>`;bind()}
function visualReveal(){stage.innerHTML=`<section class="card casefile"><aside class="sidebar"><div class="eyebrow">Visual finding</div><h2>${state.suspect}</h2><div class="cover-main"><div class="slash"></div></div><div class="chip"><strong>WARNING</strong><br>Similarity is not provenance.</div></aside><div class="screen"><div class="screenhead"><div><div class="eyebrow">Το πρώτο ίχνος</div><h2>Το 91% δεν είναι απόδειξη.</h2></div></div><div class="copy">Το cover του VOID87 είναι πράγματι το πιο κοντινό οπτικά. Αυτό όμως μπορεί να σημαίνει κοινό designer, κοινή αισθητική ή απλώς τάση της εποχής. Χρειαζόμαστε σχέσεις, όχι μόνο ομοιότητες.</div><div class="statement-grid"><div class="statement"><span class="tag">OBSERVATION</span><h3>Παρόμοια παλέτα</h3><p>Ροζ γεωμετρία, σκοτεινό φόντο και cyan accent.</p></div><div class="statement"><span class="tag">UNKNOWN</span><h3>Κοινός δημιουργός;</h3><p>Δεν έχουμε ακόμη metadata που να το υποστηρίζουν.</p></div><div class="statement"><span class="tag">NEXT STEP</span><h3>Δίκτυο</h3><p>Ποιος συνδέεται πραγματικά με ποιον;</p></div></div><div class="options"><button class="option" data-go="network"><span class="num">→</span><span><strong>Άνοιξε το Network Board</strong></span></button></div></div></section>`;bind()}
function networkSVG(highlight=false){return `<svg viewBox="0 0 900 520" role="img" aria-label="Δίκτυο καλλιτεχνών και παραγωγών"><g>${[['170','150','300','110'],['170','150','300','220'],['300','110','430','165'],['300','220','430','165'],['610','130','735','95'],['610','130','735','185'],['610','250','735','185'],['610','250','735','305'],['430','165','520','220'],['520','220','610','130'],['520','220','610','250']].map((e,i)=>`<line class="edge ${highlight&&i>=8?'bridge':''}" x1="${e[0]}" y1="${e[1]}" x2="${e[2]}" y2="${e[3]}"/>`).join('')}</g><g class="node artist"><circle cx="170" cy="150" r="34"/><text x="170" y="155" text-anchor="middle">RAY</text></g><g class="node producer"><circle cx="300" cy="110" r="40"/><text x="300" y="115" text-anchor="middle">NERO</text></g><g class="node producer"><circle cx="300" cy="220" r="40"/><text x="300" y="225" text-anchor="middle">VOID87</text></g><g class="node artist"><circle cx="430" cy="165" r="36"/><text x="430" y="170" text-anchor="middle">LUNA</text></g><g class="node producer mira"><circle cx="520" cy="220" r="42"/><text x="520" y="225" text-anchor="middle">MIRA</text></g><g class="node artist"><circle cx="610" cy="130" r="34"/><text x="610" y="135" text-anchor="middle">VX</text></g><g class="node artist"><circle cx="610" cy="250" r="34"/><text x="610" y="255" text-anchor="middle">KID A</text></g><g class="node producer"><circle cx="735" cy="95" r="39"/><text x="735" y="100" text-anchor="middle">SOMA</text></g><g class="node producer"><circle cx="735" cy="185" r="42"/><text x="735" y="190" text-anchor="middle">VANTA</text></g><g class="node artist"><circle cx="735" cy="305" r="34"/><text x="735" y="310" text-anchor="middle">MEL</text></g></svg>`}
function network(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act II · Connect</div><h2>Ποιος φαίνεται σημαντικότερος;</h2></div><p>Μεγαλύτερος αριθμός συνδέσεων δεν σημαίνει πάντα πιο κρίσιμη θέση.</p></div><div class="networkwrap"><div class="network">${networkSVG(false)}</div><aside class="legend"><h3>Network Board</h3><div class="metric"><span>NERO</span><strong>14 links</strong></div><div class="metric"><span>VOID87</span><strong>9 links</strong></div><div class="metric"><span>SOMA</span><strong>7 links</strong></div><div class="metric"><span>KID VANTA</span><strong>8 links</strong></div><div class="metric"><span>MIRA</span><strong>5 links</strong></div><p class="copy" style="font-size:.9rem">Ποιος θα ήταν η πρώτη σου επιλογή αν κοίταζες μόνο τον αριθμό των συνεργασιών;</p></aside></div><div class="options" style="grid-template-columns:repeat(5,1fr);margin-top:10px">${suspects.map((s,i)=>`<button class="option" data-degree="${s}"><span class="num">${i+1}</span><span><strong>${s}</strong></span></button>`).join('')}</div></section>`;bind()}
function bridge(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act III · The Bridge</div><h2>Το νέο στοιχείο αλλάζει την ερώτηση.</h2></div><p>Το NO SIGNAL προωθήθηκε ταυτόχρονα από artists δύο διαφορετικών clusters.</p></div><div class="networkwrap"><div class="network">${networkSVG(true)}</div><aside class="legend"><h3>Bridge clue</h3><p class="copy" style="font-size:.9rem">Η MIRA έχει λιγότερες συνολικές συνδέσεις, αλλά είναι η μόνη producer που βρίσκεται πάνω στη διαδρομή ανάμεσα στις δύο communities.</p><div class="chip"><strong>NETWORK ROLE</strong><br>Bridge / high betweenness</div></aside></div><div class="options"><button class="option" data-go="falselead"><span class="num">→</span><span><strong>Έλεγξε το οπτικό false lead</strong><small>Γιατί το VOID87 έμοιαζε τόσο πειστικό;</small></span></button></div></section>`;bind()}
function falselead(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act IV · False lead</div><h2>Τρία πράγματα που δεν είναι το ίδιο.</h2></div></div><div class="statement-grid"><div class="statement"><span class="tag">A</span><h3>«Τα covers έχουν ίδια παλέτα.»</h3><p>Τι είδους πληροφορία είναι;</p></div><div class="statement"><span class="tag">B</span><h3>«Ο ίδιος designer δούλεψε και στα δύο.»</h3><p>Τι είδους πληροφορία είναι;</p></div><div class="statement"><span class="tag">C</span><h3>«Άρα τα releases συνδέονται δημιουργικά.»</h3><p>Τι είδους πληροφορία είναι;</p></div></div><div class="copy" style="margin:12px 0">Ποια σειρά είναι σωστή;</div><div class="options" style="grid-template-columns:repeat(3,1fr)"><button class="option" data-logic="good"><span class="num">1</span><span><strong>Παρατήρηση → Τεκμήριο → Συμπέρασμα</strong></span></button><button class="option" data-logic="bad"><span class="num">2</span><span><strong>Τεκμήριο → Συμπέρασμα → Παρατήρηση</strong></span></button><button class="option" data-logic="bad"><span class="num">3</span><span><strong>Συμπέρασμα → Παρατήρηση → Τεκμήριο</strong></span></button></div></section>`;bind()}
function timeline(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act V · Timeline</div><h2>Η ακολουθία έχει σημασία.</h2></div><p>Το δίκτυο λέει ποιος συνδέεται. Ο χρόνος βοηθά να δούμε πότε αυτές οι συνδέσεις έγιναν σχετικές.</p></div><div class="timeline"><div class="event"><div class="date">ΜΑΡΤΙΟΣ</div><h3>MIRA × LUNA</h3><p>Πρώτη συνεργασία με artist του δυτικού cluster.</p></div><div class="event"><div class="date">ΜΑΪΟΣ</div><h3>MIRA × VX</h3><p>Νέα συνεργασία με artist του ανατολικού cluster.</p></div><div class="event"><div class="date">ΙΟΥΝΙΟΣ</div><h3>NO SIGNAL</h3><p>Το track ανεβαίνει ανώνυμα στις 02:13.</p></div><div class="event"><div class="date">02:31</div><h3>LUNA + VX</h3><p>Και οι δύο το προωθούν μέσα σε 18 λεπτά.</p></div></div><div class="options"><button class="option" data-go="deduction"><span class="num">→</span><span><strong>Κλείσε την υπόθεση</strong><small>Διάλεξε suspect, ισχυρότερο τεκμήριο και confidence.</small></span></button></div></section>`;bind()}
function deduction(){stage.innerHTML=`<section class="card casefile"><aside class="sidebar"><div class="eyebrow">Close the case</div><h2>Τελική αναφορά</h2><div class="copy">Δεν χρειάζεται απόλυτη βεβαιότητα. Χρειάζεται η καλύτερα τεκμηριωμένη εξήγηση.</div><div class="chip"><strong>1.</strong> Suspect</div><div class="chip"><strong>2.</strong> Strongest evidence</div><div class="chip"><strong>3.</strong> Confidence</div></aside><div class="screen"><div class="eyebrow">Βήμα 1/3</div><h2>Ποιος producer βρίσκεται πιθανότερα πίσω από το NO SIGNAL;</h2><div class="options">${suspects.map((s,i)=>`<button class="option" data-final="${s}"><span class="num">${i+1}</span><span><strong>${s}</strong><small>${s==='MIRA'?'5 links · bridge between communities':s==='NERO'?'14 links · largest hub':s==='VOID87'?'strongest visual match':'connected to one main cluster'}</small></span></button>`).join('')}</div></div></section>`;bind()}
function reason(){const rs=[['Visual similarity','Το cover έχει το ισχυρότερο visual match.'],['Number of collaborations','Ο producer έχει τις περισσότερες συνδέσεις.'],['Position in network','Ο producer γεφυρώνει δύο communities.'],['Timeline','Οι σχετικές συνεργασίες προηγούνται άμεσα του upload.'],['Shared label','Υπάρχει κοινό label.']];stage.innerHTML=`<section class="card screen"><div class="eyebrow">Βήμα 2/3</div><h2>Ποιο είναι το ισχυρότερο τεκμήριο;</h2><div class="options">${rs.map((r,i)=>`<button class="option" data-reason="${r[0]}"><span class="num">${i+1}</span><span><strong>${r[0]}</strong><small>${r[1]}</small></span></button>`).join('')}</div></section>`;bind()}
function confidence(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Βήμα 3/3</div><h2>Πόσο βέβαιος είσαι;</h2><div class="copy">Η αβεβαιότητα δεν είναι αποτυχία. Είναι μέρος μιας σωστής ερευνητικής αναφοράς.</div><div class="options"><button class="option" data-confidence="Low"><span class="num">1</span><span><strong>Low</strong></span></button><button class="option" data-confidence="Medium"><span class="num">2</span><span><strong>Medium</strong></span></button><button class="option" data-confidence="High"><span class="num">3</span><span><strong>High</strong></span></button></div></section>`;bind()}
function report(){const s=state.score;const total=Math.round((s.visual+s.network+s.evidence+s.critical)/4);const right=state.suspect==='MIRA';const goodReason=['Position in network','Timeline'].includes(state.reason);stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Case report</div><h2>${right?'Η υπόθεση στέκεται.':'Η υπόθεση χρειάζεται επανεξέταση.'}</h2></div><p>Η MIRA είναι η ισχυρότερη εξήγηση του case, όχι επειδή έχει τις περισσότερες επαφές ή το πιο όμοιο artwork, αλλά επειδή συνδέει τα δύο relevant clusters και το timeline στηρίζει τη σύνδεση.</p></div><div class="report"><div class="scorebox"><div class="scorebig">${total}<small>/100</small></div><div class="bars">${[['Visual Analysis',s.visual],['Network Reasoning',s.network],['Evidence',s.evidence],['Critical Interpretation',s.critical]].map(x=>`<div class="bar"><label><span>${x[0]}</span><strong>${x[1]}</strong></label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div></div>`).join('')}</div></div><div class="conclusion"><div class="eyebrow">Your deduction</div><h2>${state.suspect}</h2><div class="finding"><strong>Strongest evidence:</strong> ${state.reason}<br><strong>Confidence:</strong> ${state.confidence}</div><div class="copy">${right&&goodReason?'Ξεχώρισες την οπτική ομοιότητα από τη δικτυακή σχέση και χρησιμοποίησες το bridge μαζί με το timeline.':'Κάποιο στοιχείο πήρε περισσότερο βάρος από όσο δικαιολογούσαν τα δεδομένα. Στο συγκεκριμένο case, το bridge και το timeline είναι ισχυρότερα από τη visual similarity.'}</div><div class="finding"><strong>NEW CONNECTION FOUND</strong><br>SEOUL / CREATIVE TEAM 04<br><span style="color:var(--muted)">Next case: THE LOST COMEBACK</span></div><div class="options"><button class="option" data-restart="1"><span class="num">↻</span><span><strong>Παίξε ξανά</strong></span></button></div></div></div></section>`;bind()}
function render(){({intro,briefing,visual,visualReveal,network,bridge,falselead,timeline,deduction,reason,confidence,report}[state.mode]||intro)()}
function activate(){const a=options(),el=a[state.focus];if(state.mode==='intro'){setMode('briefing');return}if(!el)return;if(el.dataset.go){setMode(el.dataset.go);return}if(el.dataset.visual){state.suspect=el.dataset.visual;state.score.visual+=el.dataset.visual==='VOID87'?18:8;state.score.critical+=4;setMode('visualReveal');return}if(el.dataset.degree){state.score.network+=el.dataset.degree==='NERO'?10:5;state.score.critical+=el.dataset.degree==='NERO'?0:2;setMode('bridge');return}if(el.dataset.logic){if(el.dataset.logic==='good'){state.score.evidence+=22;state.score.critical+=18}else{state.score.evidence-=8}setMode('timeline');return}if(el.dataset.final){state.suspect=el.dataset.final;if(state.suspect==='MIRA'){state.score.network+=22;state.score.evidence+=10}else state.score.critical-=8;setMode('reason');return}if(el.dataset.reason){state.reason=el.dataset.reason;if(['Position in network','Timeline'].includes(state.reason)){state.score.evidence+=18;state.score.critical+=10}else state.score.evidence-=5;setMode('confidence');return}if(el.dataset.confidence){state.confidence=el.dataset.confidence;if(state.confidence==='Medium')state.score.critical+=10;if(state.confidence==='High'&&state.suspect==='MIRA')state.score.critical+=5;setMode('report');return}if(el.dataset.restart){location.reload()}}
function move(d){const a=options();if(!a.length)return;state.focus=(state.focus+d+a.length)%a.length;updateFocus()}
function back(){if(!state.history.length)return;state.mode=state.history.pop();state.focus=0;render()}
function hint(){const hints={visual:'Κοίτα geometry και palette, αλλά θυμήσου ότι αυτά δείχνουν similarity — όχι απαραίτητα κοινή προέλευση.',network:'Ο μεγαλύτερος κόμβος είναι hub. Η υπόθεση όμως ίσως χρειάζεται κάποιον που συνδέει δύο ομάδες.',falselead:'Παρατήρηση είναι αυτό που βλέπεις. Τεκμήριο είναι πληροφορία που μπορεί να ελεγχθεί. Συμπέρασμα είναι η ερμηνεία σου.',deduction:'Σύγκρινε hub με bridge και μετά κοίτα το timeline.'};alert(hints[state.mode]||'Συνδύασε περισσότερα από ένα είδη στοιχείων πριν κλείσεις την υπόθεση.')}
window.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();move(-1)}else if(['Enter',' '].includes(e.key)){e.preventDefault();activate()}else if(e.key==='Escape'){back()}else if(e.key.toLowerCase()==='h'){hint()}});
render();
</script>
</body>
</html>
