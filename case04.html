<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Music Files — Case 04</title>
<style>
:root{--bg:#080a0d;--panel:#12161b;--panel2:#1a2027;--ink:#eef2f5;--muted:#95a0aa;--line:#35404b;--cyan:#77e2ff;--mag:#ff6db1;--amber:#ffd166;--green:#8be0b0;--red:#ff8d8d;--shadow:0 24px 80px rgba(0,0,0,.5)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 80% 10%,#18202a 0,#0b0f14 40%,#06080a 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}#app{height:100dvh;display:grid;grid-template-rows:44px minmax(0,1fr) 50px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,10,13,.96)}.brand{font-weight:900;letter-spacing:.16em;color:var(--cyan);font-size:.85rem}.status{font-size:.86rem;color:var(--muted)}.status strong{color:var(--ink)}main{padding:12px;overflow:hidden;display:flex;justify-content:center}.stage{width:min(1380px,100%);height:100%;overflow:hidden}.card{height:100%;border:1px solid var(--line);background:linear-gradient(145deg,rgba(24,29,36,.98),rgba(10,13,17,.99));box-shadow:var(--shadow);overflow:hidden}.controls{display:flex;justify-content:center;align-items:center;gap:20px;border-top:1px solid var(--line);background:#080b0e;color:var(--muted);font-size:.82rem}.key{border:1px solid #56616d;border-radius:4px;padding:2px 6px;color:var(--ink);font-weight:800;margin-right:4px}.center{height:100%;display:grid;place-items:center;padding:40px;text-align:center}.case-tag{letter-spacing:.22em;color:var(--mag);font-size:.78rem;font-weight:900}.title{font-size:clamp(3.2rem,7vw,6.6rem);line-height:.9;margin:.18em 0;font-weight:950}.subtitle{color:#cbd2d8;font-family:Georgia,serif;font-size:clamp(1rem,1.4vw,1.25rem);max-width:900px;line-height:1.45}.prompt{display:inline-block;margin-top:24px;border:1px solid var(--cyan);padding:10px 18px;color:var(--cyan);font-weight:900}.feed{display:grid;gap:8px;margin-top:14px;max-width:780px}.feed div{border-left:3px solid var(--cyan);background:#12171d;padding:9px 12px;text-align:left}.feed strong{color:var(--cyan)}.screen{padding:20px;overflow:hidden;display:flex;flex-direction:column}.screen h2{font-size:2.2rem;margin:.1em 0}.screenhead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:12px}.screenhead p{max-width:660px;margin:0;color:var(--muted);line-height:1.35}.eyebrow{color:var(--mag);letter-spacing:.16em;text-transform:uppercase;font-weight:900;font-size:.74rem}.copy{font-family:Georgia,serif;color:#d2d7db;line-height:1.42;font-size:1.03rem}.options{display:grid;gap:8px;margin-top:auto}.option{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 12px;display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;cursor:pointer;line-height:1.22}.option small{display:block;color:var(--muted);margin-top:2px}.option.focused{outline:3px solid var(--cyan);background:#222a33;transform:translateX(2px)}.num{font-weight:900;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1}.metriccard{border:1px solid var(--line);background:#12171c;padding:14px}.metriccard strong{display:block;font-size:2rem;color:var(--cyan)}.metriccard h3{margin:.2em 0;color:var(--amber)}.metriccard p{color:#d5dade;line-height:1.35}.networkwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;flex:1;min-height:0}.network{border:1px solid var(--line);background:#0b0f13;position:relative;overflow:hidden}.network svg{width:100%;height:100%}.edge{stroke:#52606d;stroke-width:2;opacity:.7}.edge.hot{stroke:var(--amber);stroke-width:4;opacity:1}.node circle{fill:#1d252d;stroke:#6c7a87;stroke-width:2}.node text{fill:#eef2f5;font-size:14px;font-weight:800}.node.hot circle{stroke:var(--amber);stroke-width:4}.node.a circle{fill:#15303a}.node.b circle{fill:#2f1c2a}.side{border:1px solid var(--line);background:#12171c;padding:12px;overflow:auto}.side h3{margin:0 0 8px;color:var(--amber)}.row{display:flex;justify-content:space-between;border-bottom:1px solid #2d3740;padding:8px 0;color:#c8d0d6}.row strong{color:var(--cyan)}.scenario{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1}.box{border:1px solid var(--line);background:#12171c;padding:14px}.box h3{margin:.2em 0;color:var(--amber)}.box p{color:#d5dade;line-height:1.38}.tag{display:inline-block;font-size:.68rem;letter-spacing:.12em;border:1px solid #4b5661;padding:4px 6px;color:var(--muted)}.report{display:grid;grid-template-columns:270px 1fr;gap:16px;flex:1}.scorebox{border:1px solid var(--line);background:#10151a;padding:18px}.scorebig{font-size:4.8rem;font-weight:950;color:var(--cyan);line-height:.9}.scorebig small{font-size:1rem;color:var(--muted)}.bars{display:grid;gap:10px;margin-top:18px}.bar label{display:flex;justify-content:space-between;font-size:.8rem;color:#cbd2d8}.track{height:6px;background:#28313a;margin-top:4px}.fill{height:100%;background:linear-gradient(90deg,var(--mag),var(--cyan))}.conclusion{border:1px solid var(--line);background:#12171c;padding:18px;display:flex;flex-direction:column}.finding{border-left:3px solid var(--amber);padding:10px 12px;background:#1a1f24;margin:10px 0;color:#dce1e5}@media(max-height:720px){.screen{padding:14px}.screen h2{font-size:1.7rem}.copy{font-size:.9rem}.metriccard,.box{padding:10px}.option{padding:7px 9px;font-size:.9rem}}
</style></head><body><div id="app"><div class="topbar"><div class="brand">THE MUSIC FILES</div><div class="status">CASE 04 · <strong>THE FEATURE</strong></div></div><main><div id="stage" class="stage"></div></main><div class="controls"><span><b class="key">↑↓</b> επιλογή</span><span><b class="key">Enter</b> επιβεβαίωση</span><span><b class="key">H</b> hint</span><span><b class="key">Esc</b> πίσω</span></div></div>
<script>
const stage=document.getElementById('stage');const state={mode:'intro',focus:0,history:[],score:{degree:50,between:50,communities:50,critical:50},answer:null,reason:null,confidence:null};function setMode(m){state.history.push(state.mode);state.mode=m;state.focus=0;render()}function options(){return[...stage.querySelectorAll('.option')]}function updateFocus(){options().forEach((x,i)=>x.classList.toggle('focused',i===state.focus))}function bind(){options().forEach((b,i)=>b.onclick=()=>{state.focus=i;activate()});updateFocus()}
function networkSVG(cut=false){return `<svg viewBox="0 0 900 520"><line class="edge" x1="120" y1="110" x2="260" y2="100"/><line class="edge" x1="120" y1="220" x2="260" y2="100"/><line class="edge" x1="120" y1="330" x2="260" y2="100"/><line class="edge" x1="260" y1="100" x2="390" y2="190"/><line class="edge ${!cut?'hot':''}" x1="390" y1="190" x2="510" y2="250"/><line class="edge ${!cut?'hot':''}" x1="510" y1="250" x2="650" y2="150"/><line class="edge" x1="650" y1="150" x2="790" y2="90"/><line class="edge" x1="650" y1="150" x2="790" y2="210"/><line class="edge" x1="650" y1="150" x2="790" y2="330"/><g class="node a"><circle cx="120" cy="110" r="37"/><text x="120" y="115" text-anchor="middle">RAY</text></g><g class="node a"><circle cx="120" cy="220" r="37"/><text x="120" y="225" text-anchor="middle">LUNA</text></g><g class="node a"><circle cx="120" cy="330" r="37"/><text x="120" y="335" text-anchor="middle">NIKO</text></g><g class="node a"><circle cx="260" cy="100" r="46"/><text x="260" y="105" text-anchor="middle">NERO</text></g><g class="node a"><circle cx="390" cy="190" r="42"/><text x="390" y="195" text-anchor="middle">MEL</text></g><g class="node hot"><circle cx="510" cy="250" r="48"/><text x="510" y="255" text-anchor="middle">ARI</text></g><g class="node b"><circle cx="650" cy="150" r="45"/><text x="650" y="155" text-anchor="middle">SEOJIN</text></g><g class="node b"><circle cx="790" cy="90" r="37"/><text x="790" y="95" text-anchor="middle">MINA</text></g><g class="node b"><circle cx="790" cy="210" r="37"/><text x="790" y="215" text-anchor="middle">JUNE</text></g><g class="node b"><circle cx="790" cy="330" r="37"/><text x="790" y="335" text-anchor="middle">VEE</text></g></svg>`}
function intro(){stage.innerHTML=`<section class="card center"><div><div class="case-tag">CASE 04 · TWO SCENES / ONE NAME</div><div class="title">THE<br>FEATURE</div><div class="subtitle">Ένας artist εμφανίζεται ξανά και ξανά σε collaborations που συνδέουν δύο φαινομενικά ξεχωριστές μουσικές σκηνές. Δεν είναι ο πιο δημοφιλής, ούτε αυτός με τις περισσότερες συνεργασίες. Κι όμως, σχεδόν κάθε διαδρομή περνά από εκεί.</div><div class="feed"><div><strong>09:10</strong> — COLLAB GRAPH UPDATED</div><div><strong>09:12</strong> — TWO COMMUNITIES DETECTED</div><div><strong>09:14</strong> — BRIDGE NODE FLAGGED</div></div><div class="prompt">ENTER — ΑΝΟΙΞΕ ΤΗΝ ΥΠΟΘΕΣΗ</div></div></section>`}
function briefing(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Case briefing</div><h2>Ποιος είναι πραγματικά «σημαντικός» σε ένα δίκτυο;</h2><div class="copy">Θα συγκρίνεις τρεις διαφορετικές ιδέες: <strong>δημοφιλία</strong>, <strong>πολλές άμεσες συνδέσεις</strong> και <strong>στρατηγική θέση ανάμεσα σε ομάδες</strong>. Το δύσκολο είναι ότι αυτές δεν δείχνουν πάντα το ίδιο πρόσωπο.</div><div class="metrics" style="margin-top:16px"><div class="metriccard"><strong>42K</strong><h3>Popularity</h3><p>Πόσο γνωστός είναι κάποιος.</p></div><div class="metriccard"><strong>9</strong><h3>Degree</h3><p>Πόσες άμεσες συνδέσεις έχει.</p></div><div class="metriccard"><strong>0.71</strong><h3>Betweenness</h3><p>Πόσες σύντομες διαδρομές περνούν από τον κόμβο.</p></div><div class="metriccard"><strong>2</strong><h3>Communities</h3><p>Δύο σαφείς ομάδες στο ίδιο δίκτυο.</p></div></div><div class="options"><button class="option" data-go="degree"><span class="num">→</span><span><strong>Άνοιξε το network board</strong></span></button></div></section>`;bind()}
function degree(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act I · Degree</div><h2>Ποιος φαίνεται σημαντικότερος με την πρώτη ματιά;</h2></div><p>Αν μετρήσεις μόνο άμεσες συνεργασίες, ένας κόμβος ξεχωρίζει αμέσως.</p></div><div class="networkwrap"><div class="network">${networkSVG()}</div><aside class="side"><h3>Direct links</h3><div class="row"><span>NERO</span><strong>9</strong></div><div class="row"><span>SEOJIN</span><strong>8</strong></div><div class="row"><span>ARI</span><strong>5</strong></div><div class="row"><span>MEL</span><strong>4</strong></div><p class="copy" style="font-size:.9rem">Ποιος θα διάλεγες αν degree = importance;</p></aside></div><div class="options" style="grid-template-columns:repeat(4,1fr);margin-top:10px"><button class="option" data-degree="NERO"><span class="num">1</span><span><strong>NERO</strong></span></button><button class="option" data-degree="SEOJIN"><span class="num">2</span><span><strong>SEOJIN</strong></span></button><button class="option" data-degree="ARI"><span class="num">3</span><span><strong>ARI</strong></span></button><button class="option" data-degree="MEL"><span class="num">4</span><span><strong>MEL</strong></span></button></div></section>`;bind()}
function communities(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act II · Communities</div><h2>Τώρα δες τις ομάδες, όχι μόνο τα νούμερα.</h2></div><p>Η αριστερή και η δεξιά πλευρά έχουν πυκνές εσωτερικές συνδέσεις. Ανάμεσά τους υπάρχει στενό πέρασμα.</p></div><div class="networkwrap"><div class="network">${networkSVG()}</div><aside class="side"><h3>Community view</h3><div class="row"><span>Cluster A</span><strong>Greek trap</strong></div><div class="row"><span>Cluster B</span><strong>K-pop / global pop</strong></div><div class="row"><span>Bridge path</span><strong>MEL → ARI → SEOJIN</strong></div><p class="copy" style="font-size:.9rem">Ο ARI δεν έχει το μεγαλύτερο degree. Βρίσκεται όμως ακριβώς στο σημείο όπου ενώνονται οι δύο ομάδες.</p></aside></div><div class="options"><button class="option" data-go="cut"><span class="num">→</span><span><strong>Αφαίρεσε τον ARI από το δίκτυο</strong><small>Δες τι αλλάζει.</small></span></button></div></section>`;bind()}
function cut(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act III · Remove a node</div><h2>Τι συμβαίνει όταν λείπει ο bridge;</h2></div><p>Η αφαίρεση ενός κόμβου είναι ένας απλός τρόπος να δεις τη δομική του σημασία.</p></div><div class="networkwrap"><div class="network">${networkSVG(true)}</div><aside class="side"><h3>Network change</h3><div class="row"><span>ARI</span><strong>removed</strong></div><div class="row"><span>Cross-scene paths</span><strong>-82%</strong></div><div class="row"><span>Communities</span><strong>separate</strong></div><p class="copy" style="font-size:.9rem">Το δίκτυο δεν καταρρέει. Αλλά οι δύο σκηνές σχεδόν αποσυνδέονται μεταξύ τους.</p></aside></div><div class="options"><button class="option" data-cut="hub"><span class="num">1</span><span><strong>Άρα ο ARI είναι hub</strong><small>Έχει τις περισσότερες συνδέσεις.</small></span></button><button class="option" data-cut="bridge"><span class="num">2</span><span><strong>Άρα ο ARI είναι bridge</strong><small>Η θέση του συνδέει communities.</small></span></button><button class="option" data-cut="popular"><span class="num">3</span><span><strong>Άρα ο ARI είναι ο πιο δημοφιλής</strong><small>Η δομή δείχνει fame.</small></span></button></div></section>`;bind()}
function interpretation(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Act IV · Interpretation</div><h2>Τι μπορούμε — και τι δεν μπορούμε — να συμπεράνουμε;</h2><div class="scenario"><div class="box"><span class="tag">SUPPORTED</span><h3>Structural bridge</h3><p>Ο ARI συνδέει δύο communities και έχει υψηλή betweenness.</p></div><div class="box"><span class="tag">PLAUSIBLE</span><h3>Cultural broker</h3><p>Μπορεί να μεταφέρει αισθητικές, επαφές ή ευκαιρίες μεταξύ των σκηνών.</p></div><div class="box"><span class="tag">NOT PROVEN</span><h3>Cause of the trend</h3><p>Το network μόνο του δεν αποδεικνύει ότι αυτός δημιούργησε ή προκάλεσε μια τάση.</p></div></div><div class="copy" style="margin:12px 0">Ποια δήλωση είναι η πιο προσεκτική;</div><div class="options" style="grid-template-columns:repeat(3,1fr)"><button class="option" data-interpret="good"><span class="num">1</span><span><strong>Ο ARI είναι κρίσιμος bridge ανάμεσα στις δύο σκηνές.</strong></span></button><button class="option" data-interpret="bad"><span class="num">2</span><span><strong>Ο ARI δημιούργησε τη σύνδεση των δύο σκηνών.</strong></span></button><button class="option" data-interpret="bad"><span class="num">3</span><span><strong>Ο ARI είναι ο πιο διάσημος artist του δικτύου.</strong></span></button></div></section>`;bind()}
function final(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case</div><h2>Ποιος κόμβος έχει τη σημαντικότερη θέση για τη σύνδεση των δύο communities;</h2><div class="options"><button class="option" data-final="NERO"><span class="num">1</span><span><strong>NERO</strong><small>highest degree</small></span></button><button class="option" data-final="SEOJIN"><span class="num">2</span><span><strong>SEOJIN</strong><small>large local hub</small></span></button><button class="option" data-final="ARI"><span class="num">3</span><span><strong>ARI</strong><small>bridge position</small></span></button><button class="option" data-final="MEL"><span class="num">4</span><span><strong>MEL</strong><small>local connector</small></span></button></div></section>`;bind()}
function reason(){const rs=[['Most followers','Δημοφιλία εκτός δικτύου.'],['Highest degree','Περισσότερες άμεσες συνδέσεις.'],['Highest betweenness','Πολλές shortest paths περνούν από τον κόμβο.'],['Best visual style','Δεν αφορά τη δομή του network.']];stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 2/3</div><h2>Ποιο metric στηρίζει περισσότερο την επιλογή σου;</h2><div class="options">${rs.map((r,i)=>`<button class="option" data-reason="${r[0]}"><span class="num">${i+1}</span><span><strong>${r[0]}</strong><small>${r[1]}</small></span></button>`).join('')}</div></section>`;bind()}
function confidence(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 3/3</div><h2>Πόσο βέβαιος είσαι;</h2><div class="copy">Εδώ η δομική ένδειξη είναι ισχυρή: μιλάμε για θέση στο network, όχι για πρόθεση ή αιτιότητα.</div><div class="options"><button class="option" data-confidence="Low"><span class="num">1</span><span><strong>Low</strong></span></button><button class="option" data-confidence="Medium"><span class="num">2</span><span><strong>Medium</strong></span></button><button class="option" data-confidence="High"><span class="num">3</span><span><strong>High</strong></span></button></div></section>`;bind()}
function report(){const s=state.score,total=Math.max(0,Math.min(100,Math.round((s.degree+s.between+s.communities+s.critical)/4)));const right=state.answer==='ARI',goodReason=state.reason==='Highest betweenness';stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Case report</div><h2>${right?'Βρήκες τον bridge.':'Μπέρδεψες το hub με τον bridge.'}</h2></div><p>Το degree μετρά άμεσες συνδέσεις. Η betweenness εντοπίζει κόμβους που βρίσκονται πάνω σε πολλές διαδρομές μεταξύ άλλων κόμβων — συχνά bridges ανάμεσα σε communities.</p></div><div class="report"><div class="scorebox"><div class="scorebig">${total}<small>/100</small></div><div class="bars">${[['Degree',s.degree],['Betweenness',s.between],['Communities',s.communities],['Critical Interpretation',s.critical]].map(x=>`<div class="bar"><label><span>${x[0]}</span><strong>${x[1]}</strong></label><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,x[1]))}%"></div></div></div>`).join('')}</div></div><div class="conclusion"><div class="eyebrow">Your finding</div><h2>${state.answer}</h2><div class="finding"><strong>Strongest metric:</strong> ${state.reason}<br><strong>Confidence:</strong> ${state.confidence}</div><div class="copy">${right&&goodReason?'Ξεχώρισες σωστά τη δημοφιλία και το degree από τη δομική θέση. Ο ARI είναι σημαντικός επειδή γεφυρώνει τις δύο communities, όχι επειδή έχει τις περισσότερες συνεργασίες.':'Στο συγκεκριμένο case, το κρίσιμο στοιχείο είναι η θέση ανάμεσα στις δύο communities. Η υψηλή betweenness εξηγεί γιατί η αφαίρεση του ARI μειώνει δραματικά τις cross-scene paths.'}</div><div class="finding"><strong>NEW FILE UNLOCKED</strong><br>CASE 05 · THE GHOST LABEL<br><span style="color:var(--muted)">A label barely appears in the metadata — yet its network footprint is everywhere.</span></div><div class="options"><button class="option" data-restart="1"><span class="num">↻</span><span><strong>Παίξε ξανά</strong></span></button></div></div></div></section>`;bind()}
function render(){({intro,briefing,degree,communities,cut,interpretation,final,reason,confidence,report}[state.mode]||intro)()}function activate(){const a=options(),el=a[state.focus];if(state.mode==='intro'){setMode('briefing');return}if(!el)return;if(el.dataset.go){setMode(el.dataset.go);return}if(el.dataset.degree){state.score.degree+=el.dataset.degree==='NERO'?20:8;state.score.critical+=el.dataset.degree==='NERO'?2:0;setMode('communities');return}if(el.dataset.cut){if(el.dataset.cut==='bridge'){state.score.between+=24;state.score.communities+=12;state.score.critical+=10}else state.score.critical-=8;setMode('interpretation');return}if(el.dataset.interpret){if(el.dataset.interpret==='good'){state.score.critical+=20;state.score.communities+=12}else state.score.critical-=10;setMode('final');return}if(el.dataset.final){state.answer=el.dataset.final;if(state.answer==='ARI'){state.score.between+=20;state.score.communities+=12}else state.score.critical-=8;setMode('reason');return}if(el.dataset.reason){state.reason=el.dataset.reason;if(state.reason==='Highest betweenness'){state.score.between+=18;state.score.critical+=10}else if(state.reason==='Highest degree'){state.score.degree+=6;state.score.critical-=6}else state.score.critical-=5;setMode('confidence');return}if(el.dataset.confidence){state.confidence=el.dataset.confidence;if(state.confidence==='High'&&state.answer==='ARI')state.score.critical+=8;if(state.confidence==='Medium')state.score.critical+=5;setMode('report');return}if(el.dataset.restart)location.reload()}function move(d){const a=options();if(!a.length)return;state.focus=(state.focus+d+a.length)%a.length;updateFocus()}function back(){if(!state.history.length)return;state.mode=state.history.pop();state.focus=0;render()}function hint(){const h={degree:'Degree = πόσες άμεσες συνδέσεις έχει ένας κόμβος. Δεν λέει απαραίτητα αν ενώνει διαφορετικές ομάδες.',communities:'Κοίτα ποιος βρίσκεται ανάμεσα στα δύο clusters.',cut:'Αν αφαιρέσεις έναν bridge, οι communities μπορεί να παραμείνουν εσωτερικά ισχυρές αλλά να χάσουν τη μεταξύ τους σύνδεση.',interpretation:'Η δομή μπορεί να δείξει ρόλο στο network, όχι απαραίτητα πρόθεση ή αιτία.'};alert(h[state.mode]||'Ρώτα ποιο metric απαντά πραγματικά στην ερώτηση του case.')};window.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();move(-1)}else if(['Enter',' '].includes(e.key)){e.preventDefault();activate()}else if(e.key==='Escape')back();else if(e.key.toLowerCase()==='h')hint()});render();
</script></body></html>
