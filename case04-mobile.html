<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a0d"><title>The Music Files — Case 04 Mobile</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#shell{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 68px}#game{width:100%;height:100%;border:0;background:#080a0d}.touchbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:#333c45;padding:1px calc(1px + env(safe-area-inset-right)) calc(1px + env(safe-area-inset-bottom)) calc(1px + env(safe-area-inset-left));border-top:1px solid #56616d}.touch{border:0;background:#10151a;color:#eef2f5;min-height:54px;padding:5px 2px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;touch-action:manipulation}.touch.primary{background:#17303a;color:#77e2ff}.icon{font-size:1.25rem;font-weight:900;line-height:1}.label{font-size:.64rem;line-height:1;white-space:nowrap}@media(orientation:landscape) and (max-height:600px){#shell{grid-template-rows:minmax(0,1fr) 52px}.touch{min-height:44px;flex-direction:row;gap:4px}.icon{font-size:1rem}.label{font-size:.6rem}}</style></head><body><div id="shell"><iframe id="game" src="./case04.html" title="The Music Files Case 04"></iframe><nav class="touchbar"><button class="touch" data-key="Escape"><span class="icon">←</span><span class="label">Πίσω</span></button><button class="touch" data-key="ArrowUp"><span class="icon">↑</span><span class="label">Πάνω</span></button><button class="touch primary" data-key="Enter"><span class="icon">●</span><span class="label">Επιλογή</span></button><button class="touch" data-key="ArrowDown"><span class="icon">↓</span><span class="label">Κάτω</span></button><button class="touch" data-key="h"><span class="icon">?</span><span class="label">Hint</span></button></nav></div><script>const frame=document.getElementById('game');const css=String.raw`*{min-width:0!important;box-sizing:border-box!important}html{height:100%!important;overflow:hidden!important}body{height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-y!important}#app{height:auto!important;min-height:100%!important;display:block!important}.topbar{position:sticky!important;top:0!important;z-index:30!important;height:40px!important;min-height:40px!important;padding:0 10px!important}.brand{font-size:.66rem!important}.status{font-size:.66rem!important;max-width:55vw!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}main{display:block!important;height:auto!important;overflow:visible!important;padding:6px!important}.stage,.card{height:auto!important;min-height:calc(100dvh - 48px)!important;overflow:visible!important}.controls{display:none!important}.center{min-height:calc(100dvh - 48px)!important;padding:22px 14px!important}.title{font-size:clamp(2.9rem,16vw,4.7rem)!important}.subtitle{font-size:1rem!important;line-height:1.4!important}.feed div{font-size:.84rem!important;padding:8px 10px!important}.screen{padding:12px!important;overflow:visible!important;height:auto!important}.screen h2{font-size:1.7rem!important;line-height:1.05!important}.screenhead{display:block!important}.screenhead p{font-size:.87rem!important;margin-top:5px!important}.copy{font-size:.95rem!important}.metrics{grid-template-columns:1fr 1fr!important;height:auto!important;gap:8px!important}.metriccard{padding:10px!important}.metriccard strong{font-size:1.7rem!important}.metriccard h3{font-size:1rem!important}.metriccard p{font-size:.85rem!important}.networkwrap{display:block!important;height:auto!important}.network{height:auto!important;aspect-ratio:1.15!important;margin-bottom:8px!important}.node text{font-size:16px!important}.side{overflow:visible!important;padding:10px!important}.row{font-size:.82rem!important;padding:6px 0!important}.scenario{grid-template-columns:1fr!important;height:auto!important;gap:8px!important}.box{padding:10px!important}.box h3{font-size:1rem!important}.box p{font-size:.88rem!important}.options{grid-template-columns:1fr!important!important;height:auto!important;gap:7px!important;margin-top:10px!important}.option{width:100%!important;min-height:50px!important;padding:9px 10px!important;font-size:.92rem!important;grid-template-columns:24px minmax(0,1fr)!important;transform:none!important}.screen>.options[style*="repeat(4"]{grid-template-columns:1fr 1fr!important}.screen>.options[style*="repeat(3"]{grid-template-columns:1fr!important}.report{display:block!important;height:auto!important}.scorebox{padding:12px!important;margin-bottom:10px!important}.scorebig{font-size:3.7rem!important}.conclusion{padding:12px!important}.finding{font-size:.88rem!important;line-height:1.3!important}@media(max-width:360px){.metrics{grid-template-columns:1fr!important}.screen>.options[style*="repeat(4"]{grid-template-columns:1fr!important}.network{aspect-ratio:1!important}}@media(orientation:landscape) and (max-height:600px){.topbar{height:36px!important;min-height:36px!important}.screen{padding:9px!important}.screen h2{font-size:1.45rem!important}.metrics{grid-template-columns:repeat(4,1fr)!important}.metriccard{padding:7px!important}.metriccard strong{font-size:1.3rem!important}.metriccard p{font-size:.72rem!important}.networkwrap{display:grid!important;grid-template-columns:minmax(0,1fr) 210px!important;gap:7px!important}.network{height:calc(100dvh - 185px)!important;min-height:260px!important;aspect-ratio:auto!important;margin:0!important}.scenario{grid-template-columns:repeat(3,1fr)!important}.screen>.options[style*="repeat(4"]{grid-template-columns:repeat(4,1fr)!important}.screen>.options[style*="repeat(3"]{grid-template-columns:repeat(3,1fr)!important}.option{min-height:42px!important;padding:7px!important;font-size:.8rem!important}.report{display:grid!important;grid-template-columns:190px 1fr!important;gap:8px!important}}`;function sendKey(key){try{frame.contentWindow.focus();frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}))}catch(e){}}document.querySelectorAll('.touch').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();sendKey(b.dataset.key)}));frame.addEventListener('load',()=>{try{const d=frame.contentDocument,s=d.createElement('style');s.textContent=css;d.head.appendChild(s);const st=d.getElementById('stage');if(st)new MutationObserver(()=>{d.body.scrollTop=0;d.documentElement.scrollTop=0}).observe(st,{childList:true})}catch(e){console.error(e)}});</script></body></html>
