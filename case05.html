<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Music Files — Case 05</title>
<style>
:root{--bg:#080a0d;--panel:#12161b;--panel2:#1a2027;--ink:#eef2f5;--muted:#95a0aa;--line:#35404b;--cyan:#77e2ff;--mag:#ff6db1;--amber:#ffd166;--green:#8be0b0;--vio:#9b8cff;--shadow:0 24px 80px rgba(0,0,0,.5)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 20% 10%,#17242a 0,#0b0f14 42%,#06080a 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}#app{height:100dvh;display:grid;grid-template-rows:44px minmax(0,1fr) 50px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,10,13,.96)}.brand{font-weight:900;letter-spacing:.16em;color:var(--cyan);font-size:.85rem}.status{font-size:.86rem;color:var(--muted)}.status strong{color:var(--ink)}main{padding:12px;overflow:hidden;display:flex;justify-content:center}.stage{width:min(1380px,100%);height:100%;overflow:hidden}.card{height:100%;border:1px solid var(--line);background:linear-gradient(145deg,rgba(24,29,36,.98),rgba(10,13,17,.99));box-shadow:var(--shadow);overflow:hidden}.controls{display:flex;justify-content:center;align-items:center;gap:20px;border-top:1px solid var(--line);background:#080b0e;color:var(--muted);font-size:.82rem}.key{border:1px solid #56616d;border-radius:4px;padding:2px 6px;color:var(--ink);font-weight:800;margin-right:4px}.center{height:100%;display:grid;place-items:center;padding:40px;text-align:center}.case-tag{letter-spacing:.22em;color:var(--mag);font-size:.78rem;font-weight:900}.title{font-size:clamp(3.1rem,7vw,6.5rem);line-height:.9;margin:.18em 0;font-weight:950}.subtitle{color:#cbd2d8;font-family:Georgia,serif;font-size:clamp(1rem,1.4vw,1.25rem);max-width:920px;line-height:1.45}.prompt{display:inline-block;margin-top:24px;border:1px solid var(--cyan);padding:10px 18px;color:var(--cyan);font-weight:900}.feed{display:grid;gap:8px;margin-top:14px;max-width:800px}.feed div{border-left:3px solid var(--amber);background:#12171d;padding:9px 12px;text-align:left}.feed strong{color:var(--cyan)}.screen{padding:20px;overflow:hidden;display:flex;flex-direction:column}.screen h2{font-size:2.2rem;margin:.1em 0}.screenhead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:12px}.screenhead p{max-width:660px;margin:0;color:var(--muted);line-height:1.35}.eyebrow{color:var(--mag);letter-spacing:.16em;text-transform:uppercase;font-weight:900;font-size:.74rem}.copy{font-family:Georgia,serif;color:#d2d7db;line-height:1.42;font-size:1.03rem}.options{display:grid;gap:8px;margin-top:auto}.option{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 12px;display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;cursor:pointer;line-height:1.22}.option small{display:block;color:var(--muted);margin-top:2px}.option.focused{outline:3px solid var(--cyan);background:#222a33;transform:translateX(2px)}.num{font-weight:900;color:var(--muted)}
.featuregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1}.feature{border:1px solid var(--line);background:#12171c;padding:14px}.feature h3{margin:.2em 0;color:var(--amber)}.feature p{color:#d5dade;line-height:1.38}.tag{display:inline-block;font-size:.68rem;letter-spacing:.12em;border:1px solid #4b5661;padding:4px 6px;color:var(--muted)}.networkwrap{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;flex:1;min-height:0}.network{border:1px solid var(--line);background:#0b0f13;position:relative;overflow:hidden}.network svg{width:100%;height:100%}.edge{stroke:#52606d;stroke-width:2;opacity:.6}.edge.studio{stroke:var(--cyan)}.edge.dist{stroke:var(--mag)}.edge.design{stroke:var(--amber)}.edge.strong{stroke-width:5;opacity:.95}.node circle{fill:#1d252d;stroke:#6c7a87;stroke-width:2}.node text{fill:#eef2f5;font-size:13px;font-weight:800}.node.release circle{fill:#142630}.node.org circle{fill:#2e1d2a}.node.ghost circle{stroke:var(--amber);stroke-width:4;fill:#302817}.side{border:1px solid var(--line);background:#12171c;padding:12px;overflow:auto}.side h3{margin:0 0 8px;color:var(--amber)}.row{display:flex;justify-content:space-between;border-bottom:1px solid #2d3740;padding:8px 0;color:#c8d0d6;gap:10px}.row strong{color:var(--cyan)}.matrix{display:grid;grid-template-columns:170px repeat(4,1fr);border:1px solid var(--line);flex:1;min-height:0}.cell{padding:10px;border-right:1px solid #29333c;border-bottom:1px solid #29333c;background:#11161b;display:flex;align-items:center;justify-content:center;text-align:center}.cell.head{background:#182028;color:var(--cyan);font-weight:900}.cell.name{justify-content:flex-start;color:#eef2f5;font-weight:800}.yes{color:var(--green);font-weight:900}.no{color:#58636e}.weight{display:inline-block;min-width:34px;padding:3px 6px;border:1px solid #50606e;border-radius:12px}.logic{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1}.logicbox{border:1px solid var(--line);background:#12171c;padding:14px}.logicbox h3{margin:.2em 0;color:var(--amber)}.logicbox p{color:#d5dade;line-height:1.38}.report{display:grid;grid-template-columns:270px 1fr;gap:16px;flex:1}.scorebox{border:1px solid var(--line);background:#10151a;padding:18px}.scorebig{font-size:4.8rem;font-weight:950;color:var(--cyan);line-height:.9}.scorebig small{font-size:1rem;color:var(--muted)}.bars{display:grid;gap:10px;margin-top:18px}.bar label{display:flex;justify-content:space-between;font-size:.8rem;color:#cbd2d8}.track{height:6px;background:#28313a;margin-top:4px}.fill{height:100%;background:linear-gradient(90deg,var(--mag),var(--cyan))}.conclusion{border:1px solid var(--line);background:#12171c;padding:18px;display:flex;flex-direction:column}.finding{border-left:3px solid var(--amber);padding:10px 12px;background:#1a1f24;margin:10px 0;color:#dce1e5}@media(max-height:720px){.screen{padding:14px}.screen h2{font-size:1.7rem}.copy{font-size:.9rem}.feature,.logicbox{padding:10px}.option{padding:7px 9px;font-size:.9rem}.cell{padding:7px;font-size:.8rem}}
</style></head><body><div id="app"><div class="topbar"><div class="brand">THE MUSIC FILES</div><div class="status">CASE 05 · <strong>THE GHOST LABEL</strong></div></div><main><div id="stage" class="stage"></div></main><div class="controls"><span><b class="key">↑↓</b> επιλογή</span><span><b class="key">Enter</b> επιβεβαίωση</span><span><b class="key">H</b> hint</span><span><b class="key">Esc</b> πίσω</span></div></div>
<script>
const stage=document.getElementById('stage');const state={mode:'intro',focus:0,history:[],score:{community:50,weights:50,metadata:50,critical:50},answer:null,reason:null,confidence:null};function setMode(m){state.history.push(state.mode);state.mode=m;state.focus=0;render()}function options(){return[...stage.querySelectorAll('.option')]}function updateFocus(){options().forEach((x,i)=>x.classList.toggle('focused',i===state.focus))}function bind(){options().forEach((b,i)=>b.onclick=()=>{state.focus=i;activate()});updateFocus()}
function net(mode='all'){const showGhost=mode==='ghost';const studio=mode==='studio'||mode==='all'||mode==='ghost';const dist=mode==='dist'||mode==='all'||mode==='ghost';const design=mode==='design'||mode==='all'||mode==='ghost';return `<svg viewBox="0 0 920 520">${studio?'<line class="edge studio strong" x1="130" y1="105" x2="355" y2="105"/><line class="edge studio strong" x1="130" y1="220" x2="355" y2="105"/><line class="edge studio" x1="130" y1="335" x2="355" y2="105"/><line class="edge studio" x1="130" y1="430" x2="355" y2="105"/>':''}${dist?'<line class="edge dist strong" x1="130" y1="105" x2="355" y2="265"/><line class="edge dist" x1="130" y1="220" x2="355" y2="265"/><line class="edge dist strong" x1="130" y1="335" x2="355" y2="265"/><line class="edge dist" x1="130" y1="430" x2="355" y2="265"/>':''}${design?'<line class="edge design" x1="130" y1="105" x2="355" y2="420"/><line class="edge design strong" x1="130" y1="220" x2="355" y2="420"/><line class="edge design strong" x1="130" y1="335" x2="355" y2="420"/><line class="edge design" x1="130" y1="430" x2="355" y2="420"/>':''}${showGhost?'<line class="edge strong" style="stroke:#ffd166" x1="355" y1="105" x2="600" y2="260"/><line class="edge strong" style="stroke:#ffd166" x1="355" y1="265" x2="600" y2="260"/><line class="edge strong" style="stroke:#ffd166" x1="355" y1="420" x2="600" y2="260"/>':''}<g class="node release"><circle cx="130" cy="105" r="42"/><text x="130" y="110" text-anchor="middle">RLS A</text></g><g class="node release"><circle cx="130" cy="220" r="42"/><text x="130" y="225" text-anchor="middle">RLS B</text></g><g class="node release"><circle cx="130" cy="335" r="42"/><text x="130" y="340" text-anchor="middle">RLS C</text></g><g class="node release"><circle cx="130" cy="430" r="42"/><text x="130" y="435" text-anchor="middle">RLS D</text></g><g class="node org"><circle cx="355" cy="105" r="49"/><text x="355" y="110" text-anchor="middle">STUDIO 11</text></g><g class="node org"><circle cx="355" cy="265" r="49"/><text x="355" y="270" text-anchor="middle">DIST X</text></g><g class="node org"><circle cx="355" cy="420" r="49"/><text x="355" y="425" text-anchor="middle">FORM LAB</text></g>${showGhost?'<g class="node ghost"><circle cx="600" cy="260" r="60"/><text x="600" y="255" text-anchor="middle">NULL</text><text x="600" y="274" text-anchor="middle">RECORDS?</text></g>':''}</svg>`}
function intro(){stage.innerHTML=`<section class="card center"><div><div class="case-tag">CASE 05 · METADATA ANOMALY</div><div class="title">THE GHOST<br>LABEL</div><div class="subtitle">Τέσσερα releases δηλώνονται ως «independent». Δεν μοιράζονται εμφανές label. Κι όμως, χρησιμοποιούν επανειλημμένα το ίδιο studio, distributor και visual team. Το όνομα NULL RECORDS εμφανίζεται μόνο μία φορά — σε ένα παλιό invoice.</div><div class="feed"><div><strong>11:02</strong> — LABEL FIELD: EMPTY</div><div><strong>11:07</strong> — SHARED INFRASTRUCTURE DETECTED</div><div><strong>11:12</strong> — COMMUNITY SCORE RISING</div></div><div class="prompt">ENTER — ΑΝΟΙΞΕ ΤΗΝ ΥΠΟΘΕΣΗ</div></div></section>`}
function briefing(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Case briefing</div><h2>Μπορεί μια community να υπάρχει ακόμη κι αν λείπει το όνομά της;</h2><div class="copy">Θα δουλέψεις με <strong>πολλαπλούς τύπους ακμών</strong>. Μία κοινή συνεργασία μπορεί να είναι σύμπτωση. Τρεις επαναλαμβανόμενες σχέσεις δημιουργούν ισχυρότερο μοτίβο. Το ζητούμενο είναι να εντοπίσεις μια πιθανή παραγωγική community χωρίς να μετατρέψεις το pattern σε βεβαιότητα για ιδιοκτησία.</div><div class="featuregrid" style="margin-top:16px"><div class="feature"><span class="tag">EDGE TYPE</span><h3>Studio</h3><p>Πού ηχογραφήθηκε ή έγινε mastering.</p></div><div class="feature"><span class="tag">EDGE TYPE</span><h3>Distribution</h3><p>Ποιος διανέμει το release.</p></div><div class="feature"><span class="tag">EDGE TYPE</span><h3>Visual team</h3><p>Ποιος κατασκευάζει την εικόνα.</p></div><div class="feature"><span class="tag">PROBLEM</span><h3>Missing metadata</h3><p>Το label field είναι σχεδόν πάντα κενό.</p></div></div><div class="options"><button class="option" data-go="single"><span class="num">→</span><span><strong>Δες κάθε relation ξεχωριστά</strong></span></button></div></section>`;bind()}
function single(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act I · One layer at a time</div><h2>Μία ακμή δεν αρκεί.</h2></div><p>Διάλεξε ποιος τύπος σχέσης θεωρείς πιο ισχυρό πρώτο clue για κοινή παραγωγική οργάνωση.</p></div><div class="networkwrap"><div class="network">${net('studio')}</div><aside class="side"><h3>Studio layer</h3><div class="row"><span>RLS A → Studio 11</span><strong>3 sessions</strong></div><div class="row"><span>RLS B → Studio 11</span><strong>2 sessions</strong></div><div class="row"><span>RLS C → Studio 11</span><strong>1 session</strong></div><div class="row"><span>RLS D → Studio 11</span><strong>1 session</strong></div><p class="copy" style="font-size:.9rem">Το ίδιο studio είναι χρήσιμο clue, αλλά πολλά unrelated projects μπορούν να χρησιμοποιούν τον ίδιο χώρο.</p></aside></div><div class="options" style="grid-template-columns:repeat(3,1fr);margin-top:10px"><button class="option" data-layer="studio"><span class="num">1</span><span><strong>Studio</strong></span></button><button class="option" data-layer="dist"><span class="num">2</span><span><strong>Distribution</strong></span></button><button class="option" data-layer="design"><span class="num">3</span><span><strong>Visual team</strong></span></button></div></section>`;bind()}
function multiplex(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act II · Multiplex network</div><h2>Τώρα βάλε τα layers μαζί.</h2></div><p>Όταν οι ίδιοι κόμβοι συνδέονται επανειλημμένα με διαφορετικούς τύπους σχέσεων, το pattern γίνεται πιο πληροφοριακό.</p></div><div class="networkwrap"><div class="network">${net('all')}</div><aside class="side"><h3>Edge legend</h3><div class="row"><span style="color:var(--cyan)">Studio</span><strong>blue</strong></div><div class="row"><span style="color:var(--mag)">Distribution</span><strong>pink</strong></div><div class="row"><span style="color:var(--amber)">Visual team</span><strong>yellow</strong></div><p class="copy" style="font-size:.9rem">RLS A–D μοιράζονται όχι μία αλλά τρεις υποδομές σε διαφορετικούς βαθμούς.</p></aside></div><div class="options"><button class="option" data-go="weights"><span class="num">→</span><span><strong>Υπολόγισε το βάρος των σχέσεων</strong></span></button></div></section>`;bind()}
function weights(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act III · Weighted ties</div><h2>Όλες οι συνδέσεις δεν είναι ίδιες.</h2></div><p>Μετράμε πόσοι διαφορετικοί τύποι σχέσεων συνδέουν κάθε release με τον πιθανό κοινό πυρήνα.</p></div><div class="matrix"><div class="cell head">Release</div><div class="cell head">Studio</div><div class="cell head">Distribution</div><div class="cell head">Visual team</div><div class="cell head">Weight</div><div class="cell name">RLS A</div><div class="cell yes">✓</div><div class="cell yes">✓</div><div class="cell yes">✓</div><div class="cell"><span class="weight">3</span></div><div class="cell name">RLS B</div><div class="cell yes">✓</div><div class="cell yes">✓</div><div class="cell yes">✓</div><div class="cell"><span class="weight">3</span></div><div class="cell name">RLS C</div><div class="cell yes">✓</div><div class="cell yes">✓</div><div class="cell yes">✓</div><div class="cell"><span class="weight">3</span></div><div class="cell name">RLS D</div><div class="cell yes">✓</div><div class="cell yes">✓</div><div class="cell yes">✓</div><div class="cell"><span class="weight">3</span></div></div><div class="options"><button class="option" data-weight="strong"><span class="num">1</span><span><strong>Ισχυρή ένδειξη κοινής community</strong><small>Πολλαπλές, επαναλαμβανόμενες σχέσεις.</small></span></button><button class="option" data-weight="proof"><span class="num">2</span><span><strong>Απόδειξη ότι ανήκουν στο ίδιο label</strong><small>Το network αρκεί για ownership.</small></span></button><button class="option" data-weight="weak"><span class="num">3</span><span><strong>Αδύναμο pattern</strong><small>Οι πολλαπλές σχέσεις δεν προσθέτουν πληροφορία.</small></span></button></div></section>`;bind()}
function missing(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Act IV · Missing data</div><h2>Τι αλλάζει όταν λείπει ένα metadata field;</h2><div class="logic"><div class="logicbox"><span class="tag">VISIBLE DATA</span><h3>Independent</h3><p>Κάθε release εμφανίζεται σαν αυτόνομη μονάδα όταν κοιτάμε μόνο το label field.</p></div><div class="logicbox"><span class="tag">RELATIONAL DATA</span><h3>Dense cluster</h3><p>Studio, distribution και design σχηματίζουν συνεκτικό υποδίκτυο.</p></div><div class="logicbox"><span class="tag">LIMIT</span><h3>Inference</h3><p>Το cluster δείχνει πιθανή κοινή οργάνωση, όχι νομική ιδιοκτησία ή συμβόλαιο.</p></div></div><div class="copy" style="margin:12px 0">Ποιο είναι το σωστό συμπέρασμα;</div><div class="options" style="grid-template-columns:repeat(3,1fr)"><button class="option" data-missing="good"><span class="num">1</span><span><strong>Τα missing metadata μπορούν να κρύψουν μια πραγματική relational community.</strong></span></button><button class="option" data-missing="bad"><span class="num">2</span><span><strong>Ό,τι δεν υπάρχει στα metadata δεν υπάρχει και στην πραγματικότητα.</strong></span></button><button class="option" data-missing="bad"><span class="num">3</span><span><strong>Το cluster αποδεικνύει ιδιοκτησία του label.</strong></span></button></div></section>`;bind()}
function reveal(){stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Act V · Hidden node</div><h2>Το «φάντασμα» αποκτά περίγραμμα.</h2></div><p>Ένα παλιό invoice συνδέει Studio 11, Dist X και Form Lab με την ονομασία NULL RECORDS. Αυτό προσθέτει direct metadata, αλλά παραμένει ένα μόνο έγγραφο.</p></div><div class="networkwrap"><div class="network">${net('ghost')}</div><aside class="side"><h3>New evidence</h3><div class="row"><span>Invoice name</span><strong>NULL RECORDS</strong></div><div class="row"><span>Year</span><strong>previous cycle</strong></div><div class="row"><span>Current label field</span><strong>mostly blank</strong></div><p class="copy" style="font-size:.9rem">Τώρα η community hypothesis έχει και relational evidence και ένα direct documentary clue.</p></aside></div><div class="options"><button class="option" data-go="final"><span class="num">→</span><span><strong>Κλείσε την υπόθεση</strong></span></button></div></section>`;bind()}
function final(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 1/3</div><h2>Τι μπορούμε να υποστηρίξουμε καλύτερα;</h2><div class="options"><button class="option" data-final="Community"><span class="num">1</span><span><strong>Τα releases ανήκουν στην ίδια παραγωγική community.</strong><small>Relational pattern + documentary clue.</small></span></button><button class="option" data-final="Ownership"><span class="num">2</span><span><strong>Η NULL RECORDS κατέχει νομικά όλα τα releases.</strong><small>Ownership claim.</small></span></button><button class="option" data-final="Unrelated"><span class="num">3</span><span><strong>Τα releases είναι ουσιαστικά άσχετα.</strong><small>Ignore multiplex pattern.</small></span></button></div></section>`;bind()}
function reason(){const rs=[['One shared studio','Ένας κοινός provider.'],['Three repeated relation types','Studio + distribution + visual team.'],['One invoice only','Ένα direct metadata clue χωρίς το network.'],['Follower overlap','Audience similarity.']];stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 2/3</div><h2>Ποιο στοιχείο είναι ισχυρότερο;</h2><div class="options">${rs.map((r,i)=>`<button class="option" data-reason="${r[0]}"><span class="num">${i+1}</span><span><strong>${r[0]}</strong><small>${r[1]}</small></span></button>`).join('')}</div></section>`;bind()}
function confidence(){stage.innerHTML=`<section class="card screen"><div class="eyebrow">Close the case · 3/3</div><h2>Πόσο βέβαιος είσαι;</h2><div class="copy">Η community membership είναι καλύτερα στηριγμένη από την ownership claim. Το επίπεδο βεβαιότητας πρέπει να ταιριάζει ακριβώς στον ισχυρισμό.</div><div class="options"><button class="option" data-confidence="Low"><span class="num">1</span><span><strong>Low</strong></span></button><button class="option" data-confidence="Medium"><span class="num">2</span><span><strong>Medium</strong></span></button><button class="option" data-confidence="High"><span class="num">3</span><span><strong>High</strong></span></button></div></section>`;bind()}
function report(){const s=state.score,total=Math.max(0,Math.min(100,Math.round((s.community+s.weights+s.metadata+s.critical)/4)));const right=state.answer==='Community',goodReason=state.reason==='Three repeated relation types';stage.innerHTML=`<section class="card screen"><div class="screenhead"><div><div class="eyebrow">Case report</div><h2>${right?'Εντόπισες την κρυμμένη community.':'Το συμπέρασμα ξεπέρασε τα δεδομένα.'}</h2></div><p>Το σημαντικό εύρημα δεν είναι ότι «αποκαλύψαμε ένα μυστικό label», αλλά ότι relational data μπορούν να αποκαλύψουν δομή που τα επιφανειακά metadata δεν δείχνουν.</p></div><div class="report"><div class="scorebox"><div class="scorebig">${total}<small>/100</small></div><div class="bars">${[['Community Detection',s.community],['Weighted Ties',s.weights],['Metadata Reasoning',s.metadata],['Critical Interpretation',s.critical]].map(x=>`<div class="bar"><label><span>${x[0]}</span><strong>${x[1]}</strong></label><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,x[1]))}%"></div></div></div>`).join('')}</div></div><div class="conclusion"><div class="eyebrow">Your finding</div><h2>${state.answer}</h2><div class="finding"><strong>Strongest evidence:</strong> ${state.reason}<br><strong>Confidence:</strong> ${state.confidence}</div><div class="copy">${right&&goodReason?'Συνδύασες πολλαπλά edge types και δεν μπέρδεψες community structure με νομική ιδιοκτησία. Αυτό είναι ακριβώς το κρίσιμο βήμα στην ανάλυση δικτύων με ελλιπή δεδομένα.':'Η πιο ισχυρή θέση είναι ότι υπάρχει συνεκτική παραγωγική community. Για ownership ή επίσημη εταιρική σχέση θα χρειάζονταν πρόσθετα άμεσα τεκμήρια.'}</div><div class="finding"><strong>SEASON FILE UNLOCKED</strong><br>CASE 06 · THE ALGORITHM<br><span style="color:var(--muted)">Someone is predicting the next release before anyone sees it.</span></div><div class="options"><button class="option" data-restart="1"><span class="num">↻</span><span><strong>Παίξε ξανά</strong></span></button></div></div></div></section>`;bind()}
function render(){({intro,briefing,single,multiplex,weights,missing,reveal,final,reason,confidence,report}[state.mode]||intro)()}function activate(){const a=options(),el=a[state.focus];if(state.mode==='intro'){setMode('briefing');return}if(!el)return;if(el.dataset.go){setMode(el.dataset.go);return}if(el.dataset.layer){state.score.metadata+=8;state.score.critical+=4;setMode('multiplex');return}if(el.dataset.weight){if(el.dataset.weight==='strong'){state.score.weights+=24;state.score.community+=15;state.score.critical+=10}else if(el.dataset.weight==='proof'){state.score.weights+=8;state.score.critical-=12}else state.score.weights-=8;setMode('missing');return}if(el.dataset.missing){if(el.dataset.missing==='good'){state.score.metadata+=22;state.score.critical+=18}else state.score.critical-=12;setMode('reveal');return}if(el.dataset.final){state.answer=el.dataset.final;if(state.answer==='Community'){state.score.community+=22;state.score.critical+=14}else if(state.answer==='Ownership'){state.score.community+=8;state.score.critical-=15}else state.score.community-=8;setMode('reason');return}if(el.dataset.reason){state.reason=el.dataset.reason;if(state.reason==='Three repeated relation types'){state.score.weights+=18;state.score.community+=12;state.score.critical+=8}else if(state.reason==='One invoice only'){state.score.metadata+=8;state.score.critical-=5}else state.score.critical-=5;setMode('confidence');return}if(el.dataset.confidence){state.confidence=el.dataset.confidence;if(state.confidence==='High'&&state.answer==='Community')state.score.critical+=7;if(state.confidence==='Medium')state.score.critical+=5;if(state.confidence==='High'&&state.answer==='Ownership')state.score.critical-=8;setMode('report');return}if(el.dataset.restart)location.reload()}function move(d){const a=options();if(!a.length)return;state.focus=(state.focus+d+a.length)%a.length;updateFocus()}function back(){if(!state.history.length)return;state.mode=state.history.pop();state.focus=0;render()}function hint(){const h={single:'Ένας provider μπορεί να εξυπηρετεί πολλούς άσχετους πελάτες. Ψάξε επαναλαμβανόμενο pattern σε περισσότερα layers.',multiplex:'Multiplex network = περισσότεροι από ένας τύποι σχέσης ανάμεσα στα ίδια entities.',weights:'Το βάρος μιας σχέσης μπορεί να κωδικοποιεί πόσοι διαφορετικοί δεσμοί την στηρίζουν.',missing:'Missing metadata δεν ισοδυναμεί με ανυπαρξία σχέσης. Αλλά ούτε το network ισοδυναμεί με νομική απόδειξη.'};alert(h[state.mode]||'Ξεχώρισε τη δομή του network από τον ισχυρισμό που θέλεις να κάνεις γι’ αυτήν.')};window.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();move(-1)}else if(['Enter',' '].includes(e.key)){e.preventDefault();activate()}else if(e.key==='Escape')back();else if(e.key.toLowerCase()==='h')hint()});render();
</script></body></html>
